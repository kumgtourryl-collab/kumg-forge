<style>
  .chat-row{
    display: flex; gap: 12px; align-items: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s;
  }
  .chat-row:hover{ border-color: var(--green); }
  .chat-row.unread{ border-color: var(--green); background: rgba(31,157,98,.06); }

  .chat-avatar{
    width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--deep), var(--green));
    display: grid; place-items: center;
    color: #04140C; font-weight: 900; font-size: 20px;
    overflow: hidden;
  }
  .chat-avatar img{ width: 100%; height: 100%; object-fit: cover; }

  .chat-info{ flex: 1; min-width: 0; }
  .chat-info .nm{
    font-weight: 800; font-size: 15px; margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-info .preview{
    font-size: 12.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-info .shop-tag{
    display: inline-block; font-size: 10px; font-weight: 800;
    text-transform: uppercase; letter-spacing: .5px;
    color: var(--green); margin-left: 6px;
  }
  .chat-meta{
    display: flex; flex-direction: column; align-items: flex-end; gap: 4px;
    flex-shrink: 0;
  }
  .chat-meta .time{
    font-size: 10.5px; color: var(--muted);
  }
  .chat-meta .badge{
    background: var(--green); color: #04140C;
    font-size: 10px; font-weight: 800;
    min-width: 20px; height: 20px;
    border-radius: 999px;
    padding: 0 6px;
    display: grid; place-items: center;
  }
</style>

<script>
let userId = null;

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s < 60) return 'now';
  if (s < 3600) return Math.floor(s/60) + 'm';
  if (s < 86400) return Math.floor(s/3600) + 'h';
  return Math.floor(s/86400) + 'd';
}

async function load(){
  const listEl = document.getElementById('list');

  // Get chats where I'm a participant
  const result = await db
    .from('chats')
    .select('id, participant_a, participant_b, shop_id, last_message_at, last_message_preview')
    .or('participant_a.eq.' + userId + ',participant_b.eq.' + userId)
    .order('last_message_at', { ascending: false });

  if (result.error){
    listEl.innerHTML = '<p style="color:var(--muted);text-align:center;padding:40px">Could not load chats.</p>';
    return;
  }

  const chats = result.data || [];
  if (!chats.length){
    listEl.innerHTML =
      '<div class="empty" style="text-align:center;padding:40px 20px;color:var(--muted)">' +
      '<h3 style="color:var(--mint);margin:0 0 8px">No chats yet</h3>' +
      '<p style="font-size:13.5px;line-height:1.5;margin:0 0 20px">Visit a shop and tap "Chat with shop" to start a conversation.</p>' +
      '<a href="discover.html" style="display:inline-block;background:var(--green);color:#04140C;padding:12px 20px;border-radius:12px;font-weight:800;text-decoration:none;font-size:14px">Browse shops</a>' +
      '</div>';
    return;
  }

  // Collect other participants + shops
  const otherIds = [...new Set(chats.map(c => c.participant_a === userId ? c.participant_b : c.participant_a))];
  const shopIds = [...new Set(chats.map(c => c.shop_id).filter(Boolean))];

  const [profilesRes, shopsRes] = await Promise.all([
    db.from('profiles').select('id, username, email, avatar_url').in('id', otherIds),
    shopIds.length ? db.from('shops').select('id, name').in('id', shopIds) : Promise.resolve({ data: [] })
  ]);

  const profilesMap = {};
  (profilesRes.data || []).forEach(p => profilesMap[p.id] = p);
  const shopsMap = {};
  (shopsRes.data || []).forEach(s => shopsMap[s.id] = s);

  // Unread count per chat
  const unreadRes = await db
    .from('chat_messages')
    .select('chat_id')
    .in('chat_id', chats.map(c => c.id))
    .neq('sender_id', userId)
    .is('read_at', null);

  const unreadMap = {};
  (unreadRes.data || []).forEach(m => {
    unreadMap[m.chat_id] = (unreadMap[m.chat_id] || 0) + 1;
  });

  listEl.innerHTML = chats.map(c => {
    const otherId = c.participant_a === userId ? c.participant_b : c.participant_a;
    const other = profilesMap[otherId];
    const shop = c.shop_id ? shopsMap[c.shop_id] : null;
    const initial = ((other?.username || other?.email || '?')[0]).toUpperCase();
    const avatar = other?.avatar_url
      ? '<img src="' + esc(other.avatar_url) + '" alt="">'
      : initial;
    const unread = unreadMap[c.id] || 0;

    return `
      <a class="chat-row ${unread ? 'unread' : ''}" href="chat-view.html?id=${c.id}">
        <div class="chat-avatar">${avatar}</div>
        <div class="chat-info">
          <div class="nm">
            ${esc(other?.username || other?.email || 'Unknown')}
            ${shop ? '<span class="shop-tag">· ' + esc(shop.name) + '</span>' : ''}
          </div>
          <div class="preview">${esc(c.last_message_preview || 'Start the conversation')}</div>
        </div>
        <div class="chat-meta">
          <span class="time">${timeAgo(c.last_message_at)}</span>
          ${unread ? '<span class="badge">' + unread + '</span>' : ''}
        </div>
      </a>
    `;
  }).join('');
}

(async function(){
  var sess = await db.auth.getSession();
  if (!sess.data.session){ location.href = 'auth.html'; return; }
  userId = sess.data.session.user.id;
  load();

  // Refresh list every 15s
  setInterval(load, 15000);
})();
</script>
