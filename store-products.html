<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Products — TouRryl Store</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  var l = localStorage.getItem('kumg_lang') || 'en';
  document.documentElement.setAttribute('lang', l);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KUMG">
<link rel="stylesheet" href="css/style.css">
<style>
  .prod{
    display:flex;gap:12px;align-items:center;
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:12px;margin-bottom:10px;
  }
  .prod .thumb{
    width:56px;height:56px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,var(--deep),var(--green));
    display:grid;place-items:center;color:#04140C;
    font-weight:900;font-size:22px;overflow:hidden;
  }
  .prod .thumb img{width:100%;height:100%;object-fit:cover}
  .prod .body{flex:1;min-width:0}
  .prod .name{font-weight:800;font-size:15px;margin-bottom:2px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prod .meta{font-size:12.5px;color:var(--muted)}
  .prod .price{font-weight:800;color:var(--green);font-size:15px;margin-top:2px}
  .prod .out{font-size:10px;font-weight:800;letter-spacing:.5px;
    text-transform:uppercase;background:var(--danger);color:#fff;
    padding:2px 6px;border-radius:6px;margin-left:6px}

  .prod .actions{display:flex;flex-direction:column;gap:6px;flex-shrink:0}
  .prod .actions button{
    background:transparent;color:var(--muted);border:1px solid var(--line);
    padding:6px 10px;font-size:12px;border-radius:8px;font-weight:700;
  }
  .prod .actions button.danger{color:var(--danger);border-color:var(--danger)}

  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:20px;width:100%;max-width:460px;
    max-height:90vh;overflow-y:auto;
  }
  .modal h3{margin:0 0 4px}
  .modal p{margin:0 0 14px;color:var(--muted);font-size:13px}

  .img-pick{
    display:flex;gap:12px;align-items:center;margin:8px 0;
  }
  .img-pick .box{
    width:64px;height:64px;border-radius:10px;flex-shrink:0;
    background:linear-gradient(135deg,var(--deep),var(--green));
    display:grid;place-items:center;color:#04140C;
    font-weight:900;font-size:22px;overflow:hidden;
    cursor:pointer;border:2px solid var(--green);
  }
  .img-pick .box img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <a href="store.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Store</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='store-edit.html?id=' + shopId" style="font-size:13px;padding:8px 12px">Shop settings</button>
  </div>
</header>

<main class="container" style="max-width:560px">
  <h1 class="page-title" id="shopName">Products</h1>
  <p class="page-sub" id="counter">Loading…</p>

  <div id="list"></div>

  <button class="btn btn-block" id="newBtn" style="margin-top:20px">+ Add product</button>

  <button class="btn-ghost btn-block" id="previewBtn" style="margin-top:10px">
    👁 Preview public shop
  </button>
</main>

<!-- Add / edit product modal -->
<div class="modal-bg" id="prodModal">
  <div class="modal">
    <h3 id="modalTitle">New product</h3>
    <p>Add a photo, name, and price.</p>

    <div class="img-pick">
      <div class="box" id="imgPreview"><span>📷</span></div>
      <div style="flex:1;min-width:0">
        <button class="btn-ghost" id="imgBtn" style="font-size:13px;padding:8px 12px;width:100%">Upload photo</button>
        <input id="imgInput" type="file" accept="image/*" style="display:none">
      </div>
    </div>

    <label for="pName">Product name *</label>
    <input id="pName" type="text" maxlength="80" placeholder="e.g. Blue denim jacket">

    <label for="pPrice">Price *</label>
    <div style="display:flex;gap:8px">
      <input id="pPrice" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" style="flex:2">
      <select id="pCurrency" style="flex:1">
        <option value="USD">USD</option>
        <option value="ZWG">ZWG</option>
      </select>
    </div>

    <label for="pDesc">Description</label>
    <textarea id="pDesc" rows="2" maxlength="200" placeholder="Short description (optional)"></textarea>

    <label style="display:flex;align-items:center;gap:10px;margin-top:16px;font-size:14px;color:var(--text)">
      <input type="checkbox" id="pInStock" checked style="width:auto">
      In stock
    </label>

    <div style="display:flex;gap:8px;margin-top:20px">
      <button class="btn-ghost" id="cancelBtn" style="flex:1">Cancel</button>
      <button id="saveBtn" style="flex:1">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/settings.js"></script>
<script src="js/store.js"></script>
<script>
let userId = null;
let shopId = null;
let shop = null;
let editingId = null;
let currentImageUrl = null;
let pendingImageFile = null;

const listEl = document.getElementById('list');
const modal = document.getElementById('prodModal');
const modalTitle = document.getElementById('modalTitle');
const nameInput = document.getElementById('pName');
const priceInput = document.getElementById('pPrice');
const currencySelect = document.getElementById('pCurrency');
const descInput = document.getElementById('pDesc');
const inStockInput = document.getElementById('pInStock');
const imgPreview = document.getElementById('imgPreview');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

async function loadShop(){
  const { data, error } = await db.from('shops').select('*').eq('id', shopId).single();
  if (error || !data){ toast('Shop not found'); setTimeout(()=> location.href='store.html', 900); return; }
  shop = data;
  document.getElementById('shopName').textContent = data.name;
}

async function loadProducts(){
  const { data, error } = await db
    .from('shop_products')
    .select('*')
    .eq('shop_id', shopId)
    .order('sort_order', { ascending: true })
    .order('created_at', { ascending: true });

  if (error){ listEl.innerHTML = '<div class="empty"><h3>Could not load products</h3></div>'; return; }

  // Free plan check
  const { data: profile } = await db.from('profiles').select('plan').eq('id', userId).single();
  const plan = profile?.plan || 'free';
  const limit = plan === 'free' ? 5 : Infinity;

  document.getElementById('counter').textContent =
    plan === 'free'
      ? `${data.length} / 5 products (Free plan)`
      : `${data.length} products (Pro)`;

  if (!data.length){
    listEl.innerHTML = `
      <div class="empty">
        <h3>No products yet</h3>
        <p>Add your first product to start selling.</p>
      </div>`;
    return;
  }

  listEl.innerHTML = data.map(p => {
    const initial = (p.name || '?')[0].toUpperCase();
    const thumb = p.image_url ? `<img src="${escHtml(p.image_url)}" alt="">` : initial;
    return `
      <div class="prod" data-id="${p.id}">
        <div class="thumb">${thumb}</div>
        <div class="body">
          <div class="name">${escHtml(p.name)}</div>
          <div class="meta">${p.description ? escHtml(p.description) : 'No description'}</div>
          <div class="price">
            ${fmtMoney(p.price, p.currency)}
            ${p.in_stock ? '' : '<span class="out">Out of stock</span>'}
          </div>
        </div>
        <div class="actions">
          <button data-edit="${p.id}">Edit</button>
          <button class="danger" data-del="${p.id}">✕</button>
        </div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('[data-edit]').forEach(btn => {
    btn.addEventListener('click', () => openEditor(btn.dataset.edit));
  });
  listEl.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', async () => {
      if (!confirm('Delete this product?')) return;
      const { error } = await db.from('shop_products').delete().eq('id', btn.dataset.del);
      if (error){ toast(error.message || 'Delete failed'); return; }
      toast('Deleted');
      loadProducts();
    });
  });
}

function openEditor(id){
  editingId = id || null;
  pendingImageFile = null;
  currentImageUrl = null;

  if (id){
    db.from('shop_products').select('*').eq('id', id).single().then(({ data }) => {
      if (!data) return;
      modalTitle.textContent = 'Edit product';
      nameInput.value = data.name || '';
      priceInput.value = data.price || '';
      currencySelect.value = data.currency || 'USD';
      descInput.value = data.description || '';
      inStockInput.checked = data.in_stock !== false;
      currentImageUrl = data.image_url || null;

      if (data.image_url){
        imgPreview.innerHTML = `<img src="${escHtml(data.image_url)}" alt="">`;
      } else {
        imgPreview.innerHTML = `<span>${(data.name || '?')[0].toUpperCase()}</span>`;
      }
      modal.classList.add('show');
    });
  } else {
    modalTitle.textContent = 'New product';
    nameInput.value = '';
    priceInput.value = '';
    currencySelect.value = 'USD';
    descInput.value = '';
    inStockInput.checked = true;
    imgPreview.innerHTML = '<span>📷</span>';
    modal.classList.add('show');
  }
}

nameInput.addEventListener('input', () => {
  if (!pendingImageFile && !currentImageUrl){
    imgPreview.innerHTML = `<span>${(nameInput.value.trim()[0] || '📷').toUpperCase()}</span>`;
  }
});

document.getElementById('imgBtn').addEventListener('click', () => {
  document.getElementById('imgInput').click();
});

document.getElementById('imgInput').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 3 * 1024 * 1024){ toast('Max 3MB'); return; }
  if (!file.type.startsWith('image/')){ toast('Must be an image'); return; }

  pendingImageFile = file;
  const url = URL.createObjectURL(file);
  imgPreview.innerHTML = `<img src="${url}" alt="">`;
});

document.getElementById('cancelBtn').addEventListener('click', () => {
  modal.classList.remove('show');
});
modal.addEventListener('click', (e) => {
  if (e.target === modal) modal.classList.remove('show');
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const name = nameInput.value.trim();
  const price = parseFloat(priceInput.value);
  const currency = currencySelect.value;
  const description = descInput.value.trim();
  const in_stock = inStockInput.checked;

  if (!name){ toast('Product name required'); return; }
  if (isNaN(price) || price < 0){ toast('Valid price required'); return; }

  // Free plan limit
  const { data: profile } = await db.from('profiles').select('plan').eq('id', userId).single();
  const plan = profile?.plan || 'free';
  if (plan === 'free' && !editingId){
    const { count } = await db
      .from('shop_products').select('*', { count: 'exact', head: true })
      .eq('shop_id', shopId);
    if ((count || 0) >= 5){
      toast('Free plan: max 5 products. Upgrade to Pro for unlimited.');
      return;
    }
  }

  // Upload image if new
  let image_url = currentImageUrl;
  if (pendingImageFile){
    toast('Uploading photo…');
    const ext = (pendingImageFile.name.split('.').pop() || 'jpg').toLowerCase();
    const path = userId + '/prod-' + Date.now() + '.' + ext;
    const { error: upErr } = await db.storage
      .from('shop-images')
      .upload(path, pendingImageFile, { cacheControl: '3600', upsert: false });
    if (upErr){ toast(upErr.message || 'Image upload failed'); return; }
    const { data: urlData } = db.storage.from('shop-images').getPublicUrl(path);
    image_url = urlData.publicUrl;
  }

  const payload = {
    shop_id: shopId,
    name, price, currency, description, in_stock, image_url
  };

  try {
    if (editingId){
      const { error } = await db.from('shop_products').update(payload).eq('id', editingId);
      if (error) throw error;
    } else {
      // Compute sort order
      const { count } = await db
        .from('shop_products').select('*', { count: 'exact', head: true })
        .eq('shop_id', shopId);
      payload.sort_order = count || 0;
      const { error } = await db.from('shop_products').insert(payload);
      if (error) throw error;
    }
    modal.classList.remove('show');
    toast('Saved');
    loadProducts();
  } catch(err){
    console.error(err);
    toast(err.message || 'Save failed');
  }
});

document.getElementById('newBtn').addEventListener('click', () => openEditor(null));

document.getElementById('previewBtn').addEventListener('click', () => {
  if (!shop) return;
  location.href = 'store-public.html?slug=' + encodeURIComponent(shop.slug);
});

(async () => {
  const { data } = await db.auth.getSession();
  if (!data.session){ location.href = 'auth.html'; return; }
  userId = data.session.user.id;

  shopId = new URLSearchParams(location.search).get('id');
  if (!shopId){ location.href = 'store.html'; return; }

  await loadShop();
  await loadProducts();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
