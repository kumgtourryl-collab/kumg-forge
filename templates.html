<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Templates — KUMG Forge</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  var l = localStorage.getItem('kumg_lang') || 'en';
  document.documentElement.setAttribute('lang', l);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KUMG">
<link rel="stylesheet" href="css/style.css">
<style>
  .tpl-grid{display:grid;gap:12px;grid-template-columns:1fr}
  @media(min-width:560px){.tpl-grid{grid-template-columns:1fr 1fr}}
  .tpl{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:18px;cursor:pointer;
    transition:all .15s ease;text-align:left;
    color:inherit;font-family:inherit;
  }
  .tpl:hover{border-color:var(--green);transform:translateY(-2px)}
  .tpl .tag{
    display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;color:var(--green);margin-bottom:10px;
  }
  .tpl h3{margin:0 0 6px;font-size:17px}
  .tpl p{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
  .tpl .arrow{margin-top:14px;font-size:13px;color:var(--green);font-weight:700}

  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:22px;width:100%;max-width:400px;
  }
  .modal h3{margin:0 0 4px}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Forge</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='index.html'" style="font-size:13px;padding:8px 12px" data-i18n="common.back">Back</button>
  </div>
</header>

<main class="container">
  <h1 class="page-title">Start from a template</h1>
  <p class="page-sub">Pick one. Give it a name. You'll be editing in seconds.</p>

  <div class="tpl-grid" id="grid"></div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">New project</h3>
    <p id="modalSub">Give it a name. You can change it later.</p>
    <label for="projName">Project name</label>
    <input id="projName" type="text" placeholder="My Site" maxlength="60">
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-ghost" id="cancelBtn" style="flex:1" data-i18n="common.cancel">Cancel</button>
      <button id="createBtn" style="flex:1" data-i18n="common.create">Create</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/settings.js"></script>
<script src="js/projects.js"></script>
<script src="js/templates-data.js"></script>
<script>
let picked = null;

const gridEl   = document.getElementById('grid');
const modalBg  = document.getElementById('modalBg');
const nameEl   = document.getElementById('projName');
const modalTitle = document.getElementById('modalTitle');
const modalSub   = document.getElementById('modalSub');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

gridEl.innerHTML = KUMG_TEMPLATES.map(t => `
  <button class="tpl" data-id="${t.id}">
    <div class="tag">${t.tag}</div>
    <h3>${t.name}</h3>
    <p>${t.desc}</p>
    <div class="arrow">Use this →</div>
  </button>
`).join('');

gridEl.querySelectorAll('.tpl').forEach(card => {
  card.addEventListener('click', () => {
    picked = findTemplate(card.dataset.id);
    if (!picked) return;
    modalTitle.textContent = picked.name;
    modalSub.textContent = 'Give your new project a name.';
    nameEl.value = picked.name;
    modalBg.classList.add('show');
    setTimeout(()=> nameEl.focus(), 100);
  });
});

document.getElementById('cancelBtn').addEventListener('click', () => {
  modalBg.classList.remove('show');
});

nameEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('createBtn').click();
});

document.getElementById('createBtn').addEventListener('click', async () => {
  const name = nameEl.value.trim();
  if (!name){ toast('Name required'); return; }
  if (!picked){ toast('Pick a template first'); return; }

  try {
    const user = await getCurrentUser();
    if (!user){ location.href = 'auth.html'; return; }

    const p = await createProject(name);
    await updateProject(p.id, { html: picked.html, css: '', js: '' });

    modalBg.classList.remove('show');
    toast('Project created');
    location.href = 'editor.html?id=' + p.id;
  } catch(err){
    toast(err.message || 'Create failed');
  }
});

(async () => {
  const { data } = await db.auth.getSession();
  if (!data.session) location.href = 'auth.html';
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
