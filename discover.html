
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Discover — KUMG</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
})();
</script>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
<style>
  .discover-hero{
    background: linear-gradient(160deg, var(--deep), var(--green));
    padding: 26px 20px 28px;
    color: #E8F5EE;
    border-radius: 0 0 24px 24px;
    margin: 0 calc(-1 * var(--pad)) 16px;
  }
  .discover-hero .eyebrow{
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    opacity: .75;
    margin-bottom: 8px;
  }
  .discover-hero h1{
    margin: 0 0 6px;
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.5px;
    line-height: 1.15;
    color: #fff;
  }
  .discover-hero p{
    margin: 0 0 18px;
    font-size: 13.5px;
    opacity: .9;
    line-height: 1.5;
  }
  .search-wrap{
    position: relative;
    background: rgba(0,0,0,.22);
    border-radius: 999px;
    padding: 4px 4px 4px 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .search-wrap svg{
    width: 18px; height: 18px; flex-shrink: 0;
    stroke: rgba(255,255,255,.75); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .search-wrap input{
    flex: 1; min-width: 0;
    background: transparent;
    border: 0;
    color: #fff;
    font-size: 14.5px;
    padding: 10px 0;
    font-family: var(--font);
    outline: none;
  }
  .search-wrap input::placeholder{ color: rgba(255,255,255,.6); }

  .filter-row{
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 0 0 12px;
    margin: 0 0 4px;
  }
  .filter-row::-webkit-scrollbar{ display: none; }
  .filter-chip{
    flex-shrink: 0;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
  }
  .filter-chip.active{
    background: var(--green);
    border-color: var(--green);
    color: #04140C;
  }

  .shops-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 30px;
  }
  @media(min-width:640px){
    .shops-grid{ grid-template-columns: 1fr 1fr 1fr; }
  }

  .shop-tile{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: all .15s ease;
  }
  .shop-tile:hover{ border-color: var(--green); }
  .shop-tile:active{ transform: scale(.98); }

  .shop-tile .banner{
    width: 100%;
    aspect-ratio: 16/9;
    background: linear-gradient(135deg, var(--deep), var(--green));
    display: grid;
    place-items: center;
    position: relative;
    overflow: hidden;
  }
  .shop-tile .banner .letter{
    font-size: 34px;
    font-weight: 900;
    color: #fff;
  }
  .shop-tile .banner img{
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
  }

  .shop-tile .body{
    padding: 10px 12px 12px;
  }
  .shop-tile .nm{
    font-weight: 800;
    font-size: 14px;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--mint);
  }
  .shop-tile .tag{
    font-size: 11.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.4;
  }

  .empty-discover{
    text-align: center;
    padding: 50px 24px;
    max-width: 380px;
    margin: 0 auto;
  }
  .empty-discover .icon{
    width: 68px; height: 68px;
    border-radius: 18px;
    background: linear-gradient(135deg, var(--deep), var(--green));
    display: grid; place-items: center;
    margin: 0 auto 18px;
  }
  .empty-discover .icon svg{
    width: 30px; height: 30px;
    stroke: #04140C; fill: none;
    stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .empty-discover h3{
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 800;
  }
  .empty-discover p{
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.55;
  }

  .open-shop-cta{
    background: linear-gradient(135deg, var(--deep), var(--green));
    border-radius: 16px;
    padding: 22px 20px;
    color: #E8F5EE;
    text-align: center;
    margin-bottom: 24px;
  }
  .open-shop-cta h3{
    margin: 0 0 6px;
    font-size: 16px;
    font-weight: 800;
    color: #fff;
  }
  .open-shop-cta p{
    margin: 0 0 14px;
    font-size: 13px;
    opacity: .9;
    line-height: 1.5;
  }
  .open-shop-cta a{
    display: inline-block;
    background: #fff;
    color: #04140C;
    padding: 11px 22px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 13.5px;
    text-decoration: none;
  }
</style>
</head>
<body class="has-bottom-nav">

<header class="topbar">
  <div class="brand">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Discover</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="icon-btn" onclick="location.href='store.html'" title="My shops" aria-label="My shops">
      <svg viewBox="0 0 24 24">
        <path d="M 4 8 h 16 l -1.5 12 a 1.6 1.6 0 0 1 -1.6 1.4 h -9.8 a 1.6 1.6 0 0 1 -1.6 -1.4 z"/>
        <path d="M 8.5 8 V 6.5 a 3.5 3.5 0 0 1 7 0 V 8"/>
      </svg>
    </button>
  </div>
</header>

<main class="container">

  <div class="discover-hero">
    <div class="eyebrow">Real people, real shops</div>
    <h1>Shop from Zimbabwe</h1>
    <p>Every shop is run by a KUMG user. Order directly on WhatsApp.</p>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="text" placeholder="Search shops…" autocapitalize="off" autocorrect="off">
    </div>
  </div>

  <div class="filter-row" id="filterRow" style="display:none"></div>

  <div id="content"></div>

</main>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
    <span>Home</span>
  </a>
  <a class="nav-item" href="chat.html">
    <svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L3 21l1.9-6.4A8 8 0 1 1 21 12z"/></svg>
    <span>Chats</span>
  </a>
  <a class="nav-item active" href="discover.html">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/><path d="M3 12h18"/></svg>
    <span>Discover</span>
  </a>
  <a class="nav-item" href="store.html">
    <svg viewBox="0 0 24 24">
      <path d="M 4 8 h 16 l -1.5 12 a 1.6 1.6 0 0 1 -1.6 1.4 h -9.8 a 1.6 1.6 0 0 1 -1.6 -1.4 z"/>
      <path d="M 8.5 8 V 6.5 a 3.5 3.5 0 0 1 7 0 V 8"/>
    </svg>
    <span>Store</span>
  </a>

</nav>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
var STORE_BASE = 'https://kumg-forge.onrender.com/store/';

var allShops = [];
var activeCategory = 'all';

var contentEl = document.getElementById('content');
var searchEl = document.getElementById('search');
var filterRow = document.getElementById('filterRow');

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function capitalize(s){
  if (!s) return '';
  return s[0].toUpperCase() + s.slice(1);
}

async function load(){
  var res = await db
    .from('shops')
    .select('id, name, tagline, slug, logo_url, created_at')
    .eq('is_published', true)
    .order('created_at', { ascending: false })
    .limit(200);

  if (res.error){
    contentEl.innerHTML = '<div class="empty-discover"><h3>Could not load shops</h3><p>Try again in a moment.</p></div>';
    return;
  }

  allShops = res.data || [];
  renderFilters();
  render();
}

function renderFilters(){
  if (allShops.length < 6){
    filterRow.style.display = 'none';
    return;
  }
  filterRow.style.display = 'flex';
  filterRow.innerHTML = '<button class="filter-chip active" data-cat="all">All shops</button>';
  filterRow.querySelectorAll('.filter-chip').forEach(function(c){
    c.addEventListener('click', function(){
      filterRow.querySelectorAll('.filter-chip').forEach(function(x){ x.classList.remove('active'); });
      c.classList.add('active');
      activeCategory = c.dataset.cat;
      render();
    });
  });
}

function render(){
  var q = searchEl.value.trim().toLowerCase();

  var filtered = allShops.filter(function(s){
    if (!q) return true;
    return (s.name || '').toLowerCase().indexOf(q) !== -1 ||
           (s.tagline || '').toLowerCase().indexOf(q) !== -1;
  });

  if (!allShops.length){
    contentEl.innerHTML = `
      <div class="empty-discover">
        <div class="icon">
          <svg viewBox="0 0 24 24">
            <path d="M 4 8 h 16 l -1.5 12 a 1.6 1.6 0 0 1 -1.6 1.4 h -9.8 a 1.6 1.6 0 0 1 -1.6 -1.4 z"/>
            <path d="M 8.5 8 V 6.5 a 3.5 3.5 0 0 1 7 0 V 8"/>
          </svg>
        </div>
        <h3>No shops yet</h3>
        <p>Be the first to open a shop on KUMG. It takes 5 minutes and it's free.</p>
        <a href="store-edit.html" style="display:inline-block;background:var(--green);color:#04140C;padding:12px 22px;border-radius:12px;font-weight:800;text-decoration:none;font-size:14px">Open a shop</a>
      </div>
    `;
    return;
  }

  if (!filtered.length){
    contentEl.innerHTML = `
      <div class="empty-discover">
        <h3>No shops match "${esc(q)}"</h3>
        <p>Try a different search or browse everything.</p>
        <button class="btn-ghost" onclick="document.getElementById('search').value=''; window.__discoverRender && window.__discoverRender()" style="padding:12px 20px;border-radius:12px">Clear search</button>
      </div>
    `;
    return;
  }

  contentEl.innerHTML = `
    <div class="shops-grid">
      ${filtered.map(function(s){
        var initial = (s.name || '?')[0].toUpperCase();
        var img = s.logo_url ? '<img src="' + esc(s.logo_url) + '" alt="" loading="lazy">' : '';
        return '<a class="shop-tile" href="' + STORE_BASE + encodeURIComponent(s.slug) + '" target="_blank" rel="noopener">' +
          '<div class="banner"><span class="letter">' + initial + '</span>' + img + '</div>' +
          '<div class="body">' +
            '<div class="nm">' + esc(s.name) + '</div>' +
            '<div class="tag">' + esc(s.tagline || 'Shop on WhatsApp') + '</div>' +
          '</div>' +
        '</a>';
      }).join('')}
    </div>
    <div class="open-shop-cta">
      <h3>Have something to sell?</h3>
      <p>Open your TouRryl Store in 5 minutes. Free to start, no commissions.</p>
      <a href="store-edit.html">Create your shop</a>
    </div>
  `;
}

searchEl.addEventListener('input', render);
window.__discoverRender = render;

load();
</script>
</body>
</html>
