<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  var l = localStorage.getItem('kumg_lang') || 'en';
  document.documentElement.setAttribute('lang', l);
})();

<style>
  .project-card{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
    cursor:pointer;transition:border-color .15s ease;
  }
  .project-card:hover{border-color:var(--green)}
  .project-card .meta{flex:1;min-width:0}
  .project-card .name{font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .project-card .sub{font-size:12px;color:var(--muted)}
  .project-card .del{
    background:transparent;color:var(--muted);padding:8px 10px;
    font-size:18px;line-height:1;border-radius:8px;
  }
  .project-card .del:hover{color:var(--danger)}

  .store-card{
    background:linear-gradient(135deg,var(--deep),var(--green));
    border-radius:var(--radius);padding:18px;margin-bottom:16px;
    color:#E8F5EE;display:flex;justify-content:space-between;align-items:center;gap:14px;
    cursor:pointer;
  }
  .store-card:hover{opacity:.95}
  .store-card .txt{flex:1;min-width:0}
  .store-card h3{margin:0 0 4px;font-size:16px;color:#E8F5EE;display:flex;align-items:center;gap:10px}
  .store-card h3 svg{
    width:20px;height:20px;
    stroke:#E8F5EE;fill:none;stroke-width:1.9;
    stroke-linecap:round;stroke-linejoin:round;
    flex-shrink:0;
  }
  .store-card p{margin:0;font-size:12.5px;opacity:.85;line-height:1.4}
  .store-card .arrow{
    font-size:22px;font-weight:900;color:#E8F5EE;flex-shrink:0;
  }

  .sponsor-wrap{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px;margin-bottom:20px;
  }
  .sponsor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .sponsor-badge{
    font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;
    background:var(--deep);color:var(--mint);padding:3px 8px;border-radius:999px;
  }
  .sponsor-reward{font-size:11px;font-weight:700;color:var(--green)}
  .sponsor-body{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
  .sponsor-img{
    width:52px;height:52px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,var(--deep),var(--green));
    display:grid;place-items:center;color:#04140C;
    font-weight:900;font-size:20px;overflow:hidden;
  }
  .sponsor-img img{width:100%;height:100%;object-fit:cover}
  .sponsor-txt{flex:1;min-width:0}
  .sponsor-name{font-weight:800;font-size:14.5px;margin-bottom:2px}
  .sponsor-title{font-size:13px;font-weight:600;color:var(--green);margin-bottom:2px}
  .sponsor-desc{font-size:12px;color:var(--muted);line-height:1.4}
  .sponsor-btn{
    width:100%;background:var(--green);color:#04140C;border:0;
    padding:12px;border-radius:12px;font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .sponsor-btn svg{width:16px;height:16px;stroke:#04140C;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sponsor-btn:disabled{opacity:.6}

  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:20px;width:100%;max-width:380px;
  }
  .modal h3{margin:0 0 4px}
  .modal p{margin:0 0 14px;color:var(--muted);font-size:13px}
  footer.legal{
    text-align:center;font-size:12px;color:var(--muted);
    padding:24px 0 32px;
  }
  footer.legal a{color:var(--muted)}
  footer.legal a:hover{color:var(--green)}

  /* Pro pill — small, non-intrusive, only shows for pro users */
  .pro-pill{
    font-size:10px;font-weight:800;letter-spacing:.5px;
    text-transform:uppercase;
    background:var(--green);color:#04140C;
    padding:3px 8px;border-radius:999px;
    margin-right:4px;
  }
</style>

<div class="modal-bg" id="modalBg">

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>

<script>
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

const listEl = document.getElementById('list');
const modalBg = document.getElementById('modalBg');
const nameInput = document.getElementById('projName');

async function render(){
  const projects = await listProjects();
  if (!projects.length){
    listEl.innerHTML = `
      <div class="empty">
        <h3>No projects yet</h3>
        <p>Create your first project to get started.</p>
      </div>`;
    return;
  }
  listEl.innerHTML = projects.map(p => `
    <div class="project-card" data-id="${p.id}">
      <div class="meta">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="sub">
          ${p.is_published ? escapeHtml(p.subdomain || '') + '.kumg.app' : 'Draft'} · ${timeAgo(p.updated_at)}
        </div>
      </div>
      <button class="del" data-del="${p.id}" aria-label="Delete">✕</button>
    </div>
  `).join('');

  listEl.querySelectorAll('.project-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.del')) return;
      location.href = 'editor.html?id=' + card.dataset.id;
    });
  });

  listEl.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this project?')) return;
      try {
        await deleteProject(btn.dataset.del);
        toast('Deleted');
        render();
      } catch(err){
        toast(err.message || 'Delete failed');
      }
    });
  });
}

document.getElementById('storeCard').addEventListener('click', () => {
  location.href = 'store.html';
});

document.getElementById('settingsBtn').addEventListener('click', () => {
  location.href = 'settings.html';
});

document.getElementById('newBtn').addEventListener('click', () => {
  nameInput.value = '';
  modalBg.classList.add('show');
  setTimeout(()=> nameInput.focus(), 100);
});

document.getElementById('cancelBtn').addEventListener('click', () => {
  modalBg.classList.remove('show');
});

nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('createBtn').click();
});

document.getElementById('createBtn').addEventListener('click', async () => {
  const name = nameInput.value.trim();
  if (!name){ toast('Name required'); return; }
  try {
    const p = await createProject(name);
    modalBg.classList.remove('show');
    toast('Project created');
    location.href = 'editor.html?id=' + p.id;
  } catch(err){
    toast(err.message || 'Create failed');
  }
});

(async () => {
  const { data } = await db.auth.getSession();
  if (!data.session){
    location.href = 'auth.html';
    return;
  }
  document.getElementById('hello').textContent = 'Signed in as ' + data.session.user.email;

  const { data: profile } = await db
    .from('profiles')
    .select('plan, is_admin, dob, avatar_url')
    .eq('id', data.session.user.id)
    .maybeSingle();

  if (!profile?.dob){
    location.href = 'verify.html';
    return;
  }

  if (profile?.avatar_url){
    const logo = document.getElementById('brandLogo');
    if (logo){
      logo.style.background = 'none';
      logo.style.overflow = 'hidden';
      logo.innerHTML = `<img src="${profile.avatar_url}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:8px;display:block">`;
    }
  }

  if (profile?.plan === 'pro'){
    document.getElementById('proPill').style.display = 'inline-block';
  }

  if (profile?.is_admin){
    document.getElementById('adminBtn').style.display = 'grid';
    document.getElementById('adminBtn').addEventListener('click', () => {
      location.href = 'admin.html';
    });
  }

  render();
  if (typeof loadSponsorCard === 'function') loadSponsorCard();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
