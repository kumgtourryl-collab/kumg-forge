<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Sponsors — KUMG Admin</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<style>
  .sp-card{
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; margin-bottom: 10px;
  }
  .sp-card.inactive{ opacity: .65; }
  .sp-head{
    display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px;
  }
  .sp-img{
    width: 52px; height: 52px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--deep), var(--green));
    display: grid; place-items: center;
    color: #04140C; font-weight: 900; font-size: 20px;
    overflow: hidden;
  }
  .sp-img img{ width: 100%; height: 100%; object-fit: cover; }
  .sp-info{ flex: 1; min-width: 0; }
  .sp-info .nm{ font-weight: 800; font-size: 15px; margin-bottom: 2px; }
  .sp-info .title{ font-size: 12.5px; color: var(--green); font-weight: 600; margin-bottom: 2px; }
  .sp-info .meta{ font-size: 11.5px; color: var(--muted); }
  .sp-status{
    font-size: 9.5px; font-weight: 800; letter-spacing: .5px;
    text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
    flex-shrink: 0;
  }
  .sp-status.active{ background: var(--green); color: #04140C; }
  .sp-status.inactive{ background: var(--danger); color: #fff; }

  .sp-stats{
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; margin-bottom: 12px;
  }
  .sp-stat{
    background: rgba(31,157,98,.08);
    border-radius: 10px; padding: 8px;
    text-align: center;
  }
  .sp-stat .v{ font-weight: 800; font-size: 15px; color: var(--green); }
  .sp-stat .l{ font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 2px; }

  .sp-actions{ display: flex; gap: 6px; flex-wrap: wrap; }
  .sp-actions button, .sp-actions a{
    flex: 1; min-width: 100px;
    font-size: 12.5px; font-weight: 700;
    padding: 10px 12px; border-radius: 10px;
    border: 0; cursor: pointer;
    font-family: var(--font);
    text-decoration: none; text-align: center;
  }
  .sp-actions .primary{ background: var(--green); color: #04140C; }
  .sp-actions .ghost{ background: transparent; color: var(--mint); border: 1px solid var(--line); }
  .sp-actions .danger{ background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  [data-theme="light"] .sp-actions .ghost{ color: #0A1F17; }

  .topup{
    display: none;
    margin-top: 10px; padding: 12px;
    background: rgba(31,157,98,.08);
    border-radius: 10px;
    align-items: center; gap: 8px;
  }
  .topup.show{ display: flex; }
  .topup input{
    flex: 1; padding: 10px; font-size: 14px;
    background: var(--black); border: 1px solid var(--line);
    border-radius: 8px; color: var(--mint);
    font-family: var(--font);
  }
  [data-theme="light"] .topup input{ background: #fff; color: #0A1F17; }
  .topup button{
    background: var(--green); color: #04140C;
    padding: 10px 14px; border-radius: 8px; border: 0;
    font-weight: 800; font-size: 13px; cursor: pointer;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="admin.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Sponsors</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='admin.html'" style="font-size:13px;padding:8px 12px">Back</button>
  </div>
</header>

<main class="container" style="max-width:640px">
  <h1 class="page-title">Sponsor queue</h1>
  <p class="page-sub" id="summary">Loading…</p>

  <div id="list"></div>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

async function load(){
  // Admin guard
  const sess = await db.auth.getSession();
  if (!sess.data.session){ location.href = 'auth.html'; return; }

  const me = await db.from('profiles').select('is_admin').eq('id', sess.data.session.user.id).maybeSingle();
  if (!me.data || !me.data.is_admin){
    document.querySelector('main').innerHTML =
      '<div class="empty"><h3>Not allowed</h3><p>Admin only.</p></div>';
    return;
  }

  const { data, error } = await db
    .from('sponsors')
    .select('*')
    .order('is_active', { ascending: true })
    .order('created_at', { ascending: false });

  if (error){
    document.getElementById('list').innerHTML = '<div class="empty"><h3>Could not load</h3></div>';
    return;
  }

  const sponsors = data || [];
  const active = sponsors.filter(function(s){ return s.is_active; }).length;
  const inactive = sponsors.length - active;
  const totalBalance = sponsors.reduce(function(a, s){ return a + parseFloat(s.balance || 0); }, 0);

  document.getElementById('summary').textContent =
    active + ' active · ' + inactive + ' pending · $' + totalBalance.toFixed(2) + ' in balances';

  render(sponsors);
}

function render(list){
  const el = document.getElementById('list');
  if (!list.length){
    el.innerHTML = '<div class="empty"><h3>No sponsors yet</h3><p>Share the sponsor signup link.</p></div>';
    return;
  }

  el.innerHTML = list.map(function(s){
    const initial = (s.business_name || '?')[0].toUpperCase();
    const img = s.card_image_url
      ? '<img src="' + esc(s.card_image_url) + '" alt="">'
      : initial;

    return `
      <div class="sp-card ${s.is_active ? '' : 'inactive'}" data-id="${s.id}">
        <div class="sp-head">
          <div class="sp-img">${img}</div>
          <div class="sp-info">
            <div class="nm">${esc(s.business_name)}</div>
            <div class="title">${esc(s.card_title || '')}</div>
            <div class="meta">${esc(s.contact_whatsapp || '')} · ${esc(s.category || 'uncategorised')}</div>
          </div>
          <span class="sp-status ${s.is_active ? 'active' : 'inactive'}">
            ${s.is_active ? 'Active' : 'Pending'}
          </span>
        </div>

        <div class="sp-stats">
          <div class="sp-stat">
            <div class="v">$${parseFloat(s.balance || 0).toFixed(2)}</div>
            <div class="l">Balance</div>
          </div>
          <div class="sp-stat">
            <div class="v">$${parseFloat(s.bid_per_tap || 0).toFixed(2)}</div>
            <div class="l">Bid</div>
          </div>
          <div class="sp-stat">
            <div class="v">${new Date(s.created_at).toLocaleDateString()}</div>
            <div class="l">Created</div>
          </div>
        </div>

        <div class="sp-actions">
          ${s.is_active
            ? '<button class="danger" data-action="deactivate">Deactivate</button>'
            : '<button class="primary" data-action="activate">Activate</button>'}
          <button class="ghost" data-action="topup">Top up</button>
          ${s.target_url ? '<a class="ghost" href="' + esc(s.target_url) + '" target="_blank" rel="noopener">Visit</a>' : ''}
        </div>

        <div class="topup" id="topup-${s.id}">
          <input type="number" step="0.01" min="0.01" placeholder="Amount USD" data-topup-input>
          <button data-action="topup-save">Add</button>
        </div>
      </div>
    `;
  }).join('');

  el.querySelectorAll('[data-action]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      const card = btn.closest('.sp-card');
      const id = card.dataset.id;
      const action = btn.dataset.action;

      if (action === 'topup'){
        document.getElementById('topup-' + id).classList.toggle('show');
        return;
      }

      if (action === 'activate'){
        const upd = await db.from('sponsors').update({ is_active: true }).eq('id', id);
        if (upd.error){ toast(upd.error.message); return; }
        toast('Activated');
        load();
        return;
      }

      if (action === 'deactivate'){
        if (!confirm('Deactivate this sponsor?')) return;
        const upd = await db.from('sponsors').update({ is_active: false }).eq('id', id);
        if (upd.error){ toast(upd.error.message); return; }
        toast('Deactivated');
        load();
        return;
      }

      if (action === 'topup-save'){
        const input = card.querySelector('[data-topup-input]');
        const amt = parseFloat(input.value);
        if (isNaN(amt) || amt <= 0){ toast('Enter a valid amount'); return; }

        const cur = await db.from('sponsors').select('balance').eq('id', id).single();
        if (cur.error){ toast(cur.error.message); return; }
        const newBal = parseFloat(cur.data.balance || 0) + amt;

        const upd = await db.from('sponsors').update({ balance: newBal }).eq('id', id);
        if (upd.error){ toast(upd.error.message); return; }
        toast('Balance updated to $' + newBal.toFixed(2));
        load();
      }
    });
  });
}

load();
</script>
</body>
</html>
