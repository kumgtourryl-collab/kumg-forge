(function(){

})();

<style>
  .tpl-grid{display:grid;grid-template-columns:1fr;gap:12px}
  @media(min-width:560px){ .tpl-grid{grid-template-columns:1fr 1fr} }
  .tpl{
    background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:0;cursor:pointer;transition:all .15s ease;
    text-align:left;color:inherit;font-family:inherit;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .tpl:hover{border-color:var(--green)}
  .tpl:active{transform:scale(.99)}
  .tpl .preview{
    height:92px;background:linear-gradient(135deg,var(--deep),var(--green));
    display:grid;place-items:center;overflow:hidden;
  }
  .tpl .preview svg{
    width:40px;height:40px;stroke:rgba(255,255,255,.85);fill:none;
    stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;
  }
  .tpl .body{padding:14px 16px 16px}
  .tpl .tag{
    display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:1px;
    text-transform:uppercase;color:var(--green);background:rgba(31,157,98,.12);
    padding:3px 8px;border-radius:999px;margin-bottom:8px;
  }
  .tpl h3{margin:0 0 6px;font-size:15.5px;font-weight:800;letter-spacing:-0.2px}
  .tpl p{margin:0;color:var(--muted);font-size:12.5px;line-height:1.5}
  .tpl .use{
    margin-top:12px;font-size:12.5px;color:var(--green);font-weight:800;
    display:flex;align-items:center;gap:6px;
  }
  .tpl .use svg{
    width:14px;height:14px;stroke:var(--green);fill:none;
    stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;
  }
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;padding:22px;width:100%;max-width:400px;
  }
  .modal h3{margin:0 0 4px;font-size:17px}
  .modal p{margin:0 0 16px;color:var(--muted);font-size:13px;line-height:1.5}
  .modal-actions{display:flex;gap:8px;margin-top:16px}
  .modal-actions button{flex:1}
</style>
</head>

<header class="topbar">

</header>

<main class="container">
  <h1 class="page-title">Start from a template</h1>
  <p class="page-sub">Pick one. Give it a name. Edit in seconds.</p>
  <div class="tpl-grid" id="grid"></div>
</main>

<div class="modal-bg" id="modalBg">

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function findTpl(id){
  for (var i=0;i<TEMPLATES.length;i++) if (TEMPLATES[i].id === id) return TEMPLATES[i];
  return null;
}

var picked = null;
var gridEl = document.getElementById('grid');
var modalBg = document.getElementById('modalBg');
var nameEl = document.getElementById('projName');

gridEl.innerHTML = TEMPLATES.map(function(t){
  var icon = ICONS[t.tag] || ICONS['Landing'];
  return '<button class="tpl" data-id="' + t.id + '" type="button">' +
    '<div class="preview">' + icon + '</div>' +
    '<div class="body">' +
    '<span class="tag">' + t.tag + '</span>' +
    '<h3>' + t.name + '</h3>' +
    '<p>' + t.desc + '</p>' +
    '<div class="use">Use this template' +
    '<svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>' +
    '</div></div></button>';
}).join('');

gridEl.querySelectorAll('.tpl').forEach(function(card){
  card.addEventListener('click', function(){
    picked = findTpl(card.dataset.id);
    if (!picked) return;
    document.getElementById('modalTitle').textContent = picked.name;
    nameEl.value = picked.name;
    modalBg.classList.add('show');
    setTimeout(function(){ nameEl.focus(); }, 100);
  });
});

document.getElementById('cancelBtn').addEventListener('click', function(){
  modalBg.classList.remove('show');
});

nameEl.addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('createBtn').click();
});

document.getElementById('createBtn').addEventListener('click', async function(){
  const name = nameEl.value.trim();
  if (!name){ toast('Name required'); return; }
  if (!picked){ toast('Pick a template first'); return; }

  var btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.textContent = 'Creating…';

  try {
    var user = await getCurrentUser();
    if (!user){ location.href = 'auth.html'; return; }

    var p = await createProject(name);
    await updateProject(p.id, { html: picked.html, css: '', js: '' });

    modalBg.classList.remove('show');
    toast('Project created');
    location.href = 'editor.html?id=' + p.id;
  } catch(err){
    console.error(err);
    toast(err.message || 'Create failed');
    btn.disabled = false;
    btn.textContent = 'Create';
  }
});

(async function(){
  var sess = await db.auth.getSession();
  if (!sess.data.session) location.href = 'auth.html';
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
