<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Payments — KUMG Admin</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
<style>
  .pay-card{
    background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; padding: 14px; margin-bottom: 10px;
  }
  .pay-card.approved{ opacity: .55; }
  .pay-card.rejected{ opacity: .4; }

  .pay-head{
    display: flex; gap: 12px; align-items: flex-start; margin-bottom: 12px;
  }
  .pay-icon{
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--deep), var(--green));
    display: grid; place-items: center;
    color: #04140C; font-weight: 900; font-size: 18px;
  }
  .pay-info{ flex: 1; min-width: 0; }
  .pay-info .email{
    font-weight: 800; font-size: 14px;
    word-break: break-all; margin-bottom: 2px;
  }
  .pay-info .meta{ font-size: 11.5px; color: var(--muted); }
  .pay-status{
    font-size: 9.5px; font-weight: 800; letter-spacing: .5px;
    text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
    flex-shrink: 0;
  }
  .pay-status.pending{ background: #7A6520; color: #F5DEA0; }
  .pay-status.approved{ background: var(--green); color: #04140C; }
  .pay-status.rejected{ background: var(--danger); color: #fff; }

  .pay-details{
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 8px; margin-bottom: 12px;
  }
  .pay-detail{
    background: rgba(31,157,98,.08);
    border-radius: 10px; padding: 8px 10px;
  }
  .pay-detail .l{
    font-size: 10px; text-transform: uppercase;
    letter-spacing: .5px; color: var(--muted); font-weight: 700;
  }
  .pay-detail .v{
    font-size: 13px; font-weight: 700; margin-top: 2px;
    word-break: break-all;
  }

  .pay-note{
    background: rgba(31,157,98,.05);
    border-left: 3px solid var(--green);
    border-radius: 0 8px 8px 0;
    padding: 8px 12px;
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.5;
    margin-bottom: 12px;
    font-style: italic;
  }

  .pay-actions{ display: flex; gap: 6px; flex-wrap: wrap; }
  .pay-actions button,
  .pay-actions a{
    flex: 1; min-width: 100px;
    font-size: 13px; font-weight: 700;
    padding: 11px 12px; border-radius: 10px;
    border: 0; cursor: pointer;
    font-family: var(--font);
    text-decoration: none; text-align: center;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .pay-actions .approve{ background: var(--green); color: #04140C; }
  .pay-actions .reject{ background: transparent; color: var(--danger); border: 1px solid var(--danger); }
  .pay-actions .ghost{ background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .pay-actions .wa{ background: #25D366; color: #04140C; }

  .summary-row{
    display: grid; grid-template-columns: 1fr 1fr 1fr;
    gap: 8px; margin-bottom: 20px;
  }
  .summary-box{
    background: var(--card); border: 1px solid var(--line);
    border-radius: 12px; padding: 12px;
    text-align: center;
  }
  .summary-box .num{
    font-size: 20px; font-weight: 800; color: var(--green);
  }
  .summary-box .lbl{
    font-size: 10px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .5px;
    margin-top: 2px; font-weight: 700;
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="admin.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Payments</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='admin.html'" style="font-size:13px;padding:8px 12px">Back</button>
  </div>
</header>

<main class="container" style="max-width:640px">
  <h1 class="page-title">Payments</h1>
  <p class="page-sub" id="summary">Loading…</p>

  <div class="summary-row">
    <div class="summary-box">
      <div class="num" id="sPending">—</div>
      <div class="lbl">Pending</div>
    </div>
    <div class="summary-box">
      <div class="num" id="sApproved">—</div>
      <div class="lbl">Approved</div>
    </div>
    <div class="summary-box">
      <div class="num" id="sRevenue">—</div>
      <div class="lbl">Revenue</div>
    </div>
  </div>

  <div id="list"></div>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2400);
}
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}

let adminId = null;

async function load(){
  var sess = await db.auth.getSession();
  if (!sess.data.session){ location.href = 'auth.html'; return; }
  adminId = sess.data.session.user.id;

  var me = await db.from('profiles').select('is_admin').eq('id', adminId).maybeSingle();
  if (!me.data || !me.data.is_admin){
    document.querySelector('main').innerHTML =
      '<div class="empty"><h3>Not allowed</h3><p>Admin only.</p></div>';
    return;
  }

  var paymentsRes = await db
    .from('manual_payments')
    .select('*')
    .order('status', { ascending: true })
    .order('submitted_at', { ascending: false })
    .limit(100);

  var redemptionsRes = await db
    .from('redemptions')
    .select('*')
    .eq('kind', 'cash')
    .order('status', { ascending: true })
    .order('submitted_at', { ascending: false })
    .limit(100);

  if (paymentsRes.error && redemptionsRes.error){
    document.getElementById('list').innerHTML = '<div class="empty"><h3>Could not load</h3></div>';
    return;
  }

  var payments = paymentsRes.data || [];
  var redemptions = redemptionsRes.data || [];

  var all = [];
  payments.forEach(function(p){ all.push({ type: 'in', row: p }); });
  redemptions.forEach(function(r){ all.push({ type: 'out', row: r }); });
  all.sort(function(a, b){
    var sa = a.row.status === 'pending' ? 0 : 1;
    var sb = b.row.status === 'pending' ? 0 : 1;
    if (sa !== sb) return sa - sb;
    return new Date(b.row.submitted_at) - new Date(a.row.submitted_at);
  });

  var pendIn = payments.filter(function(p){ return p.status === 'pending'; }).length;
  var pendOut = redemptions.filter(function(r){ return r.status === 'pending'; }).length;
  var revenue = payments
    .filter(function(p){ return p.status === 'approved'; })
    .reduce(function(a, p){ return a + Number(p.amount || 0); }, 0);

  document.getElementById('sPending').textContent = pendIn + pendOut;
  document.getElementById('sApproved').textContent = payments.filter(function(p){ return p.status === 'approved'; }).length;
  document.getElementById('sRevenue').textContent = '$' + revenue.toFixed(2);

  document.getElementById('summary').textContent =
    pendIn + ' upgrades pending · ' + pendOut + ' cash-outs pending · ' + all.length + ' total';

  render(all);
}

function render(list){
  var el = document.getElementById('list');
  if (!list.length){
    el.innerHTML = '<div class="empty"><h3>Nothing to review</h3></div>';
    return;
  }

  el.innerHTML = list.map(function(item){
    var row = item.row;
    var isOut = item.type === 'out';

    var headLine = isOut
      ? 'Cash out · ' + esc(row.ecocash_to || '—')
      : esc(row.email || 'unknown');

    var subtitle = isOut
      ? 'Requested ' + timeAgo(row.submitted_at)
      : 'Sent from ' + esc(row.ecocash_from || '—') + ' · ' + timeAgo(row.submitted_at);

    var detailA = isOut
      ? { l: 'Send to', v: esc(row.ecocash_to || '—') }
      : { l: 'Sent from', v: esc(row.ecocash_from || '—') };

    var amount = isOut ? row.amount_cents / 100 : Number(row.amount || 0);
    var detailB = { l: 'Amount', v: '$' + amount.toFixed(2) };

    var refLine = isOut
      ? { l: 'User ID', v: esc((row.user_id || '').slice(0, 8)) }
      : { l: 'Reference', v: esc(row.reference || '—') };

    var waLink = null;
    var phone = isOut ? row.ecocash_to : row.ecocash_from;
    if (phone){
      var digits = String(phone).replace(/[^\d]/g, '').replace(/^0/, '');
      if (digits.length >= 9) waLink = 'https://wa.me/263' + digits;
    }

    return `
      <div class="pay-card ${esc(row.status)}" data-id="${row.id}" data-type="${item.type}">
        <div class="pay-head">
          <div class="pay-icon">${isOut ? '↑' : '↓'}</div>
          <div class="pay-info">
            <div class="email">${headLine}</div>
            <div class="meta">${subtitle}</div>
          </div>
          <span class="pay-status ${esc(row.status)}">${esc(row.status)}</span>
        </div>

        <div class="pay-details">
          <div class="pay-detail"><div class="l">${detailA.l}</div><div class="v">${detailA.v}</div></div>
          <div class="pay-detail"><div class="l">${detailB.l}</div><div class="v">${detailB.v}</div></div>
          <div class="pay-detail" style="grid-column:1/-1"><div class="l">${refLine.l}</div><div class="v">${refLine.v}</div></div>
        </div>

        ${row.note ? '<div class="pay-note">"' + esc(row.note) + '"</div>' : ''}

        <div class="pay-actions">
          ${row.status === 'pending' ? `
            <button class="${isOut ? 'approve' : 'approve'}" data-action="${isOut ? 'markpaid' : 'approve'}">
              ${isOut ? 'Mark as paid' : 'Approve &amp; upgrade'}
            </button>
            <button class="reject" data-action="reject">Reject</button>
            ${waLink ? '<a class="wa" href="' + waLink + '" target="_blank" rel="noopener">WhatsApp</a>' : ''}
          ` : `
            <button class="ghost" data-action="reset">Reset to pending</button>
          `}
        </div>
      </div>
    `;
  }).join('');

  el.querySelectorAll('[data-action]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      var card = btn.closest('.pay-card');
      var id = card.dataset.id;
      var type = card.dataset.type;
      var action = btn.dataset.action;

      if (action === 'approve'){
        if (!confirm('Approve this payment and upgrade the user to Pro?')) return;
        btn.disabled = true; btn.textContent = 'Approving…';

        var payment = await db.from('manual_payments').select('user_id').eq('id', id).single();
        if (payment.error || !payment.data){
          toast('Could not load payment');
          btn.disabled = false; btn.textContent = 'Approve & upgrade';
          return;
        }

        await db.from('profiles').update({ plan: 'pro' }).eq('id', payment.data.user_id);
        await db.from('manual_payments').update({
          status: 'approved',
          reviewed_at: new Date().toISOString(),
          reviewed_by: adminId
        }).eq('id', id);

        toast('User upgraded to Pro');
        load();
        return;
      }

      if (action === 'markpaid'){
        if (!confirm('Mark this cash-out as paid? The user has been sent the money.')) return;
        await db.from('redemptions').update({
          status: 'approved',
          reviewed_at: new Date().toISOString(),
          reviewed_by: adminId
        }).eq('id', id);
        toast('Marked as paid');
        load();
        return;
      }

      if (action === 'reject'){
        if (!confirm('Reject this? Balance will be refunded (for cash outs).')) return;

        if (type === 'out'){
          var red = await db.from('redemptions').select('user_id, amount_cents').eq('id', id).single();
          if (red.data){
            var w = await db.from('wallets').select('balance_cents').eq('user_id', red.data.user_id).single();
            if (w.data){
              await db.from('wallets').update({
                balance_cents: (w.data.balance_cents || 0) + Number(red.data.amount_cents || 0),
                updated_at: new Date().toISOString()
              }).eq('user_id', red.data.user_id);
            }
          }
          await db.from('redemptions').update({
            status: 'rejected',
            reviewed_at: new Date().toISOString(),
            reviewed_by: adminId
          }).eq('id', id);
        } else {
          await db.from('manual_payments').update({
            status: 'rejected',
            reviewed_at: new Date().toISOString(),
            reviewed_by: adminId
          }).eq('id', id);
        }
        toast('Rejected');
        load();
        return;
      }

      if (action === 'reset'){
        if (!confirm('Reset this to pending?')) return;
        if (type === 'out'){
          await db.from('redemptions').update({
            status: 'pending',
            reviewed_at: null,
            reviewed_by: null
          }).eq('id', id);
        } else {
          await db.from('manual_payments').update({
            status: 'pending',
            reviewed_at: null,
            reviewed_by: null
          }).eq('id', id);
        }
        toast('Reset to pending');
        load();
      }
    });
  });
}

load();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
