<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>KUMG Forge</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .project-card{
    display:flex;justify-content:space-between;align-items:center;
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;
    cursor:pointer;transition:border-color .15s ease;
  }
  .project-card:hover{border-color:var(--green)}
  .project-card .meta{flex:1;min-width:0}
  .project-card .name{font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .project-card .sub{font-size:12px;color:var(--muted)}
  .project-card .del{
    background:transparent;color:var(--muted);padding:8px 10px;
    font-size:18px;line-height:1;border-radius:8px;
  }
  .project-card .del:hover{color:var(--danger)}
  /* Modal */
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .modal-bg.show{display:flex}
  .modal{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:20px;width:100%;max-width:380px;
  }
  .modal h3{margin:0 0 4px}
  .modal p{margin:0 0 14px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">K</div>
    <div>KUMG <span class="accent">Forge</span></div>
  </div>
  <div class="actions">
    <span class="badge" id="planBadge">Free</span>
    <button class="btn-ghost" id="logoutBtn" style="font-size:13px;padding:8px 12px">Logout</button>
  </div>
</header>

<main class="container">
  <h1 class="page-title">Your projects</h1>
  <p class="page-sub" id="hello">Build the web from your pocket.</p>

  <div id="list"></div>

  <div style="display:flex;gap:10px;margin-top:20px">
    <button class="btn" id="newBtn" style="flex:1">+ Blank</button>
    <button class="btn-ghost" id="tplBtn" style="flex:1">Templates</button>
  </div>
</main>

<!-- New Project Modal -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>New project</h3>
    <p>Give it a name. You can change it later.</p>
    <label for="projName">Project name</label>
    <input id="projName" type="text" placeholder="My Portfolio" maxlength="60">
    <div style="display:flex;gap:8px;margin-top:16px">
      <button class="btn-ghost" id="cancelBtn" style="flex:1">Cancel</button>
      <button id="createBtn" style="flex:1">Create</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/projects.js"></script>
<script>
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

const listEl = document.getElementById('list');
const modalBg = document.getElementById('modalBg');
const nameInput = document.getElementById('projName');

async function render(){
  const projects = await listProjects();
  if (!projects.length){
    listEl.innerHTML = `
      <div class="empty">
        <h3>No projects yet</h3>
        <p>Create your first project to get started.</p>
      </div>`;
    return;
  }
  listEl.innerHTML = projects.map(p => `
    <div class="project-card" data-id="${p.id}">
      <div class="meta">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="sub">
          ${p.is_published ? '🌐 ' + escapeHtml(p.subdomain || '') + '.kumg.app' : 'Draft'} · ${timeAgo(p.updated_at)}
        </div>
      </div>
      <button class="del" data-del="${p.id}" aria-label="Delete">✕</button>
    </div>
  `).join('');

  listEl.querySelectorAll('.project-card').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('.del')) return;
      location.href = 'editor.html?id=' + card.dataset.id;
    });
  });

  listEl.querySelectorAll('.del').forEach(btn => {
    btn.addEventListener('click', async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this project?')) return;
      try {
        await deleteProject(btn.dataset.del);
        toast('Deleted');
        render();
      } catch(err){
        toast(err.message || 'Delete failed');
      }
    });
  });
}

// Templates button
document.getElementById('tplBtn').addEventListener('click', () => {
  location.href = 'templates.html';
});

// New (blank) project
document.getElementById('newBtn').addEventListener('click', () => {
  nameInput.value = '';
  modalBg.classList.add('show');
  setTimeout(()=> nameInput.focus(), 100);
});

document.getElementById('cancelBtn').addEventListener('click', () => {
  modalBg.classList.remove('show');
});

nameInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('createBtn').click();
});

document.getElementById('createBtn').addEventListener('click', async () => {
  const name = nameInput.value.trim();
  if (!name){ toast('Name required'); return; }
  try {
    const p = await createProject(name);
    modalBg.classList.remove('show');
    toast('Project created');
    location.href = 'editor.html?id=' + p.id;
  } catch(err){
    toast(err.message || 'Create failed');
  }
});

// Guard + load
(async () => {
  const { data } = await db.auth.getSession();
  if (!data.session){
    location.href = 'auth.html';
    return;
  }
  document.getElementById('hello').textContent = 'Signed in as ' + data.session.user.email;

  const { data: profile } = await db
    .from('profiles')
    .select('plan')
    .eq('id', data.session.user.id)
    .maybeSingle();

  if (profile?.plan === 'pro'){
    const b = document.getElementById('planBadge');
    b.textContent = 'Pro';
    b.classList.add('pro');
  }

  render();
})();

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await db.auth.signOut();
  location.href = 'auth.html';
});
</script>
</body>
</html>
