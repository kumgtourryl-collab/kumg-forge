<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,user-scalable=no">

<title>KUMG AI</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

:root{
    --bg:#050706;
    --panel:#0b110f;
    --panel2:#0e1714;
    --border:#1c2b26;
    --green:#20a96b;
    --green2:#0c5137;
    --text:#f2f7f4;
    --muted:#8b9993;
    --danger:#ef6464;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
    color:var(--text);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

button,
textarea,
input{
    font:inherit;
}

button{
    border:0;
    cursor:pointer;
}

.app{
    width:100%;
    height:100dvh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
}

/* =========================
   HEADER
========================= */

.header{
    height:72px;
    min-height:72px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 18px;
    border-bottom:1px solid var(--border);
    background:#070908;
    z-index:20;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    width:46px;
    height:46px;
    border-radius:14px;
    background:linear-gradient(145deg,#0c6b48,#20a96b);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#03130d;
    font-size:22px;
    font-weight:900;
}

.brand-name{
    font-size:22px;
    font-weight:850;
}

.brand-name span{
    color:var(--green);
}

.header-right{
    display:flex;
    align-items:center;
    gap:9px;
}

.usage{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 13px;
    border:1px solid var(--border);
    border-radius:20px;
    color:var(--muted);
    font-size:13px;
    white-space:nowrap;
}

.header-btn{
    width:44px;
    height:44px;
    border-radius:14px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--text);
    font-size:21px;
}

/* =========================
   CHAT
========================= */

.chat{
    flex:1;
    min-height:0;
    overflow-y:auto;
    padding:26px 18px 180px;
    scroll-behavior:smooth;
}

.chat-inner{
    width:100%;
    max-width:850px;
    margin:auto;
}

.welcome{
    min-height:55vh;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    text-align:center;
    padding:40px 20px;
}

.ai-icon{
    width:104px;
    height:104px;
    border-radius:30px;
    background:linear-gradient(145deg,#0c5e3f,#20a96b);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:48px;
    color:#03140d;
    margin-bottom:25px;
    box-shadow:0 15px 50px rgba(20,170,105,.15);
}

.welcome h1{
    font-size:30px;
    margin-bottom:12px;
}

.welcome p{
    color:var(--muted);
    max-width:520px;
    line-height:1.7;
    font-size:16px;
}

/* =========================
   MESSAGE
========================= */

.message{
    display:flex;
    margin:18px 0;
}

.message.user{
    justify-content:flex-end;
}

.message.ai{
    justify-content:flex-start;
}

.bubble{
    max-width:min(82%,700px);
    padding:14px 16px;
    border-radius:20px;
    line-height:1.65;
    font-size:15px;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
}

.user .bubble{
    background:var(--green);
    color:#03150d;
    border-bottom-right-radius:6px;
    font-weight:500;
}

.ai .bubble{
    background:var(--panel2);
    border:1px solid var(--border);
    color:var(--text);
    border-bottom-left-radius:6px;
}

.message-meta{
    color:#68766f;
    font-size:11px;
    margin-top:6px;
}

/* =========================
   QUICK ACTIONS
========================= */

.quick{
    position:fixed;
    left:0;
    right:0;
    bottom:116px;
    display:flex;
    gap:10px;
    overflow-x:auto;
    padding:8px 18px;
    background:linear-gradient(
        transparent,
        rgba(5,7,6,.97) 35%
    );
    z-index:10;
}

.quick::-webkit-scrollbar{
    display:none;
}

.quick button{
    flex:0 0 auto;
    padding:11px 16px;
    border-radius:22px;
    background:var(--panel);
    border:1px solid var(--border);
    color:#dce8e2;
    white-space:nowrap;
}

/* =========================
   COMPOSER
========================= */

.composer-wrap{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    padding:12px 18px 16px;
    background:linear-gradient(
        transparent,
        #050706 18%
    );
    z-index:15;
}

.composer{
    width:100%;
    max-width:850px;
    margin:auto;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:25px;
    padding:13px 14px 11px;
    box-shadow:0 -10px 40px rgba(0,0,0,.25);
}

textarea{
    width:100%;
    min-height:48px;
    max-height:150px;
    resize:none;
    border:0;
    outline:0;
    background:transparent;
    color:var(--text);
    padding:5px 8px;
    font-size:16px;
    line-height:1.5;
}

textarea::placeholder{
    color:#718078;
}

.composer-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-top:7px;
}

.tools{
    display:flex;
    gap:8px;
}

.tool{
    padding:9px 13px;
    border-radius:18px;
    background:#092018;
    border:1px solid #123d2d;
    color:var(--green);
    font-size:13px;
}

.tool.active{
    background:var(--green);
    color:#04140d;
}

.send{
    width:44px;
    height:44px;
    border-radius:50%;
    background:var(--green);
    color:#03130d;
    font-size:20px;
    font-weight:900;
}

.send:disabled{
    opacity:.35;
}

/* =========================
   DRAWER
========================= */

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.65);
    z-index:50;
    display:none;
}

.overlay.show{
    display:block;
}

.drawer{
    position:absolute;
    left:0;
    top:0;
    bottom:0;
    width:min(330px,88vw);
    background:#080c0a;
    border-right:1px solid var(--border);
    padding:20px;
    overflow-y:auto;
}

.drawer-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:22px;
}

.drawer-title{
    font-size:20px;
    font-weight:800;
}

.close{
    width:42px;
    height:42px;
    border-radius:12px;
    background:var(--panel);
    color:white;
    border:1px solid var(--border);
}

.new-chat{
    width:100%;
    padding:14px;
    border-radius:15px;
    background:var(--green);
    color:#03140d;
    font-weight:800;
    margin-bottom:18px;
}

.history-title{
    color:#6e7b75;
    font-size:12px;
    text-transform:uppercase;
    letter-spacing:1px;
    margin-bottom:10px;
}

.history-item{
    padding:13px;
    border:1px solid transparent;
    border-radius:13px;
    margin-bottom:6px;
    color:#cdd8d3;
    cursor:pointer;
}

.history-item:hover{
    background:var(--panel);
    border-color:var(--border);
}

.history-item.active{
    background:#0d2018;
    border-color:#174936;
}

/* =========================
   AUTH
========================= */

.auth{
    position:fixed;
    inset:0;
    z-index:100;
    background:#050706;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
}

.auth.show{
    display:flex;
}

.auth-card{
    width:100%;
    max-width:420px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:25px;
    padding:28px;
}

.auth-card h2{
    font-size:27px;
    margin-bottom:8px;
}

.auth-card p{
    color:var(--muted);
    line-height:1.5;
    margin-bottom:22px;
}

.auth-input{
    width:100%;
    padding:15px;
    margin-bottom:11px;
    border-radius:13px;
    border:1px solid var(--border);
    background:#080d0b;
    color:white;
    outline:none;
}

.auth-input:focus{
    border-color:var(--green);
}

.auth-btn{
    width:100%;
    padding:15px;
    border-radius:14px;
    background:var(--green);
    color:#03140d;
    font-weight:800;
    margin-top:5px;
}

.auth-switch{
    background:transparent;
    color:var(--green);
    margin-top:15px;
    width:100%;
}

.status{
    margin-top:12px;
    font-size:13px;
    color:var(--muted);
}

/* =========================
   LOADING
========================= */

.typing{
    display:flex;
    gap:5px;
    padding:5px;
}

.dot{
    width:7px;
    height:7px;
    background:var(--green);
    border-radius:50%;
    animation:bounce 1s infinite;
}

.dot:nth-child(2){
    animation-delay:.15s;
}

.dot:nth-child(3){
    animation-delay:.3s;
}

@keyframes bounce{
    0%,60%,100%{transform:translateY(0);opacity:.45}
    30%{transform:translateY(-5px);opacity:1}
}

/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .header{
        height:64px;
        min-height:64px;
        padding:0 12px;
    }

    .logo{
        width:40px;
        height:40px;
    }

    .brand-name{
        font-size:19px;
    }

    .usage{
        font-size:11px;
        padding:8px 10px;
    }

    .header-btn{
        width:40px;
        height:40px;
    }

    .chat{
        padding:18px 12px 185px;
    }

    .bubble{
        max-width:88%;
    }

    .quick{
        bottom:113px;
        padding-left:12px;
        padding-right:12px;
    }

    .composer-wrap{
        padding:9px 10px 12px;
    }

    .composer{
        border-radius:21px;
    }

    .tool{
        font-size:12px;
        padding:8px 11px;
    }

    .welcome h1{
        font-size:27px;
    }

    .welcome p{
        font-size:14px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->
    <header class="header">

        <div class="brand">
            <button class="header-btn" id="menuBtn">☰</button>

            <div class="logo">✦</div>

            <div class="brand-name">
                KUMG <span>AI</span>
            </div>
        </div>

        <div class="header-right">

            <div class="usage">
                💬 <span id="messageCount">0</span>/<span id="messageLimit">250</span>
                ·
                🖼️ <span id="imageCount">0</span>/50
            </div>

        </div>

    </header>


    <!-- CHAT -->
    <main class="chat" id="chat">

        <div class="chat-inner" id="chatInner">

            <section class="welcome" id="welcome">

                <div class="ai-icon">✦</div>

                <h1>Ask me anything</h1>

                <p>
                    KUMG AI can help you write, code, research,
                    calculate, plan and create.
                </p>

            </section>

        </div>

    </main>


    <!-- QUICK ACTIONS -->
    <div class="quick">

        <button onclick="quickPrompt('Create a professional landing page for my business.')">
            Hero section
        </button>

        <button onclick="quickPrompt('Create a short professional link-in-bio page.')">
            Link in bio
        </button>

        <button onclick="quickPrompt('Give me an idea for an image I could create for my business.')">
            Image example
        </button>

        <button onclick="quickPrompt('Calculate 250 multiplied by 24 and explain the working.')">
            Calculate
        </button>

    </div>


    <!-- COMPOSER -->
    <div class="composer-wrap">

        <div class="composer">

            <textarea
                id="messageInput"
                placeholder="Type a message"
                rows="1"></textarea>

            <div class="composer-bottom">

                <div class="tools">

                    <button
                        class="tool"
                        id="thinkBtn"
                        onclick="toggleThink()">
                        ✽ Think
                    </button>

                    <button
                        class="tool"
                        id="searchBtn"
                        onclick="toggleSearch()">
                        ◉ Search
                    </button>

                </div>

                <button
                    class="send"
                    id="sendBtn"
                    onclick="sendMessage()">
                    ↑
                </button>

            </div>

        </div>

    </div>

</div>


<!-- DRAWER -->
<div class="overlay" id="overlay">

    <aside class="drawer">

        <div class="drawer-top">

            <div class="drawer-title">
                KUMG AI
            </div>

            <button class="close" onclick="closeDrawer()">
                ×
            </button>

        </div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div class="history-title">
            Recent chats
        </div>

        <div id="history"></div>

        <button
            class="auth-switch"
            style="margin-top:30px"
            onclick="logout()">
            Sign out
        </button>

    </aside>

</div>


<!-- AUTH -->
<div class="auth" id="authScreen">

    <div class="auth-card">

        <div class="logo" style="margin-bottom:20px;">
            ✦
        </div>

        <h2 id="authTitle">
            Welcome to KUMG AI
        </h2>

        <p id="authDescription">
            Sign in to save your conversations and use KUMG AI.
        </p>

        <input
            id="email"
            class="auth-input"
            type="email"
            placeholder="Email">

        <input
            id="password"
            class="auth-input"
            type="password"
            placeholder="Password">

        <button
            class="auth-btn"
            onclick="handleAuth()"
            id="authButton">
            Sign in
        </button>

        <button
            class="auth-switch"
            onclick="toggleAuthMode()"
            id="authSwitch">
            Create an account
        </button>

        <div
            class="status"
            id="authStatus">
        </div>

    </div>

</div>


<script>

/* ============================================================
   KUMG AI CONFIGURATION
============================================================ */

/*
IMPORTANT:

Replace these two values with your Supabase project's
PUBLIC/PUBLISHABLE values.

DO NOT put your Groq API key here.
*/

const SUPABASE_URL =
    "https://YOUR_PROJECT_ID.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "YOUR_SUPABASE_PUBLISHABLE_KEY";


/*
This must point to your Render backend.

Example:

https://kumg-api.onrender.com

The backend endpoint expected by this file is:

POST /api/chat
*/

const RENDER_API =
    "https://YOUR-KUMG-BACKEND.onrender.com";


/* ============================================================
   SUPABASE
============================================================ */

const { createClient } =
    supabase;

const db =
    createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY,
        {
            auth:{
                persistSession:true,
                autoRefreshToken:true,
                detectSessionInUrl:true
            }
        }
    );


/* ============================================================
   STATE
============================================================ */

let currentUser = null;

let currentConversation = null;

let messages = [];

let authMode = "login";

let thinking = false;

let searching = false;

let sending = false;


/* ============================================================
   DOM
============================================================ */

const chat =
    document.getElementById("chat");

const chatInner =
    document.getElementById("chatInner");

const welcome =
    document.getElementById("welcome");

const input =
    document.getElementById("messageInput");

const sendBtn =
    document.getElementById("sendBtn");

const overlay =
    document.getElementById("overlay");

const authScreen =
    document.getElementById("authScreen");


/* ============================================================
   STARTUP
============================================================ */

async function init(){

    const {
        data:{
            session
        }
    } =
    await db.auth.getSession();

    if(session){

        currentUser =
            session.user;

        await startApplication();

    }else{

        authScreen.classList.add("show");

    }

    db.auth.onAuthStateChange(
        async(event,session)=>{

            if(session){

                currentUser =
                    session.user;

                authScreen.classList.remove("show");

                await startApplication();

            }

        }
    );

}


/* ============================================================
   APPLICATION START
============================================================ */

async function startApplication(){

    await loadUsage();

    await loadConversations();

    if(!currentConversation){

        await createConversation();

    }

}


/* ============================================================
   AUTH
============================================================ */

function toggleAuthMode(){

    if(authMode === "login"){

        authMode = "signup";

        document.getElementById("authTitle")
            .textContent =
            "Create your KUMG account";

        document.getElementById("authDescription")
            .textContent =
            "Create an account to save your KUMG AI conversations.";

        document.getElementById("authButton")
            .textContent =
            "Create account";

        document.getElementById("authSwitch")
            .textContent =
            "Already have an account? Sign in";

    }else{

        authMode = "login";

        document.getElementById("authTitle")
            .textContent =
            "Welcome to KUMG AI";

        document.getElementById("authDescription")
            .textContent =
            "Sign in to save your conversations and use KUMG AI.";

        document.getElementById("authButton")
            .textContent =
            "Sign in";

        document.getElementById("authSwitch")
            .textContent =
            "Create an account";

    }

}


async function handleAuth(){

    const email =
        document.getElementById("email")
            .value.trim();

    const password =
        document.getElementById("password")
            .value;

    const status =
        document.getElementById("authStatus");

    if(!email || !password){

        status.textContent =
            "Enter your email and password.";

        return;

    }

    status.textContent =
        "Please wait...";

    if(authMode === "login"){

        const {
            error
        } =
        await db.auth.signInWithPassword({
            email,
            password
        });

        if(error){

            status.textContent =
                error.message;

        }

    }else{

        const {
            data,
            error
        } =
        await db.auth.signUp({
            email,
            password
        });

        if(error){

            status.textContent =
                error.message;

        }else{

            status.textContent =
                data.session
                ? "Account created."
                : "Check your email to confirm your account.";

        }

    }

}


async function logout(){

    await db.auth.signOut();

    currentUser = null;

    currentConversation = null;

    messages = [];

    authScreen.classList.add("show");

    closeDrawer();

}


/* ============================================================
   CONVERSATIONS
============================================================ */

async function loadConversations(){

    if(!currentUser)
        return;

    const {
        data,
        error
    } =
    await db
        .from("conversations")
        .select("*")
        .eq("user_id",currentUser.id)
        .order("updated_at",{ascending:false})
        .limit(30);

    if(error){

        console.error(error);

        return;

    }

    renderHistory(data || []);

    if(data && data.length){

        currentConversation =
            data[0];

        await loadMessages(
            currentConversation.id
        );

    }

}


async function createConversation(title="New chat"){

    if(!currentUser)
        return;

    const {
        data,
        error
    } =
    await db
        .from("conversations")
        .insert({
            user_id:currentUser.id,
            title:title
        })
        .select()
        .single();

    if(error){

        console.error(error);

        return;

    }

    currentConversation =
        data;

    messages = [];

    clearChat();

    await loadConversations();

}


async function loadMessages(conversationId){

    const {
        data,
        error
    } =
    await db
        .from("messages")
        .select("*")
        .eq("conversation_id",conversationId)
        .order("created_at",{ascending:true});

    if(error){

        console.error(error);

        return;

    }

    messages =
        (data || []).map(row=>({
            role:row.role,
            content:row.content
        }));

    renderMessages();

}


function renderHistory(list){

    const history =
        document.getElementById("history");

    history.innerHTML = "";

    list.forEach(item=>{

        const el =
            document.createElement("div");

        el.className =
            "history-item" +
            (
                currentConversation &&
                item.id === currentConversation.id
                ? " active"
                : ""
            );

        el.textContent =
            item.title || "New chat";

        el.onclick =
            async()=>{

                currentConversation =
                    item;

                await loadMessages(item.id);

                closeDrawer();

            };

        history.appendChild(el);

    });

}


/* ============================================================
   MESSAGES
============================================================ */

function renderMessages(){

    chatInner.innerHTML = "";

    if(!messages.length){

        chatInner.appendChild(
            createWelcome()
        );

        return;

    }

    messages.forEach(message=>{

        appendMessage(
            message.role,
            message.content,
            false
        );

    });

    scrollBottom();

}


function createWelcome(){

    const section =
        document.createElement("section");

    section.className =
        "welcome";

    section.innerHTML = `
        <div class="ai-icon">✦</div>
        <h1>Ask me anything</h1>
        <p>
            KUMG AI can help you write, code,
            research, calculate, plan and create.
        </p>
    `;

    return section;

}


function appendMessage(
    role,
    content,
    scroll=true
){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message " +
        (role === "user" ? "user" : "ai");

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        content;

    wrapper.appendChild(bubble);

    chatInner.appendChild(wrapper);

    if(scroll)
        scrollBottom();

}


function addTyping(){

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "message ai";

    wrapper.id =
        "typingMessage";

    wrapper.innerHTML = `
        <div class="bubble">
            <div class="typing">
                <span class="dot"></span>
                <span class="dot"></span>
                <span class="dot"></span>
            </div>
        </div>
    `;

    chatInner.appendChild(wrapper);

    scrollBottom();

}


function removeTyping(){

    const el =
        document.getElementById(
            "typingMessage"
        );

    if(el)
        el.remove();

}


function scrollBottom(){

    requestAnimationFrame(()=>{
        chat.scrollTop =
            chat.scrollHeight;
    });

}


/* ============================================================
   SEND MESSAGE
============================================================ */

async function sendMessage(){

    if(sending)
        return;

    const text =
        input.value.trim();

    if(!text)
        return;

    if(!currentUser){

        authScreen.classList.add("show");

        return;

    }

    sending = true;

    sendBtn.disabled = true;

    input.value = "";

    autoResize();

    if(welcome &&
       welcome.parentNode){

        welcome.remove();

    }

    const userMessage = {
        role:"user",
        content:text
    };

    messages.push(userMessage);

    appendMessage(
        "user",
        text
    );

    await saveMessage(
        "user",
        text
    );

    const title =
        text.length > 42
        ? text.substring(0,42) + "..."
        : text;

    if(messages.length === 1){

        await db
            .from("conversations")
            .update({
                title:title,
                updated_at:new Date().toISOString()
            })
            .eq("id",currentConversation.id);

    }

    addTyping();

    try{

        const sessionResult =
            await db.auth.getSession();

        const session =
            sessionResult.data.session;

        if(!session){

            throw new Error(
                "Your session has expired. Please sign in again."
            );

        }

        const response =
            await fetch(
                RENDER_API + "/api/chat",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "Authorization":
                            "Bearer " +
                            session.access_token
                    },

                    body:JSON.stringify({

                        conversation_id:
                            currentConversation.id,

                        messages:messages,

                        think:thinking,

                        search:searching

                    })
                }
            );

        const data =
            await response.json();

        removeTyping();

        if(!response.ok){

            throw new Error(
                data.error ||
                "KUMG AI server error."
            );

        }

        const answer =
            data.answer ||
            data.message ||
            data.content;

        if(!answer){

            throw new Error(
                "The AI server returned no answer."
            );

        }

        messages.push({
            role:"assistant",
            content:answer
        });

        appendMessage(
            "assistant",
            answer
        );

        await saveMessage(
            "assistant",
            answer
        );

        await updateUsage();

        await loadConversations();

    }catch(error){

        removeTyping();

        console.error(error);

        const errorText =
            "KUMG AI couldn't complete that request.\n\n" +
            error.message;

        appendMessage(
            "assistant",
            errorText
        );

    }finally{

        sending = false;

        sendBtn.disabled = false;

        input.focus();

    }

}


/* ============================================================
   SAVE MESSAGE
============================================================ */

async function saveMessage(
    role,
    content
){

    if(!currentConversation)
        return;

    const {
        error
    } =
    await db
        .from("messages")
        .insert({
            conversation_id:
                currentConversation.id,

            user_id:
                currentUser.id,

            role:role,

            content:content
        });

    if(error)
        console.error(error);

}


/* ============================================================
   USAGE
============================================================ */

async function loadUsage(){

    if(!currentUser)
        return;

    const start =
        new Date();

    start.setHours(
        0,0,0,0
    );

    const {
        count,
        error
    } =
    await db
        .from("messages")
        .select("*",{
            count:"exact",
            head:true
        })
        .eq("user_id",currentUser.id)
        .eq("role","user")
        .gte(
            "created_at",
            start.toISOString()
        );

    if(error){

        console.error(error);

        return;

    }

    document.getElementById(
        "messageCount"
    ).textContent =
        count || 0;

}


async function updateUsage(){

    await loadUsage();

}


/* ============================================================
   NEW CHAT
============================================================ */

async function newChat(){

    await createConversation();

    closeDrawer();

}


/* ============================================================
   DRAWER
============================================================ */

document.getElementById(
    "menuBtn"
).onclick = ()=>{

    overlay.classList.add("show");

};


function closeDrawer(){

    overlay.classList.remove(
        "show"
    );

}


overlay.addEventListener(
    "click",
    event=>{

        if(event.target === overlay)
            closeDrawer();

    }
);


/* ============================================================
   THINK / SEARCH
============================================================ */

function toggleThink(){

    thinking =
        !thinking;

    document
        .getElementById("thinkBtn")
        .classList.toggle(
            "active",
            thinking
        );

}


function toggleSearch(){

    searching =
        !searching;

    document
        .getElementById("searchBtn")
        .classList.toggle(
            "active",
            searching
        );

}


/* ============================================================
   QUICK PROMPTS
============================================================ */

function quickPrompt(text){

    input.value =
        text;

    autoResize();

    input.focus();

}


/* ============================================================
   CLEAR CHAT
============================================================ */

function clearChat(){

    chatInner.innerHTML = "";

    chatInner.appendChild(
        createWelcome()
    );

}


/* ============================================================
   TEXTAREA
============================================================ */

input.addEventListener(
    "input",
    autoResize
);

function autoResize(){

    input.style.height =
        "auto";

    input.style.height =
        Math.min(
            input.scrollHeight,
            150
        ) + "px";

}


input.addEventListener(
    "keydown",
    event=>{

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            sendMessage();

        }

    }
);


/* ============================================================
   START
============================================================ */

init();

</script>
