<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F1512"/>
      <stop offset="1" stop-color="#050505"/>
    </linearGradient>

    <!-- Main green gradient -->
    <linearGradient id="green" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#4FE39B"/>
      <stop offset="0.5" stop-color="#1F9D62"/>
      <stop offset="1" stop-color="#0B3D2E"/>
    </linearGradient>

    <!-- Bright green for highlights -->
    <linearGradient id="bright" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7DF0B5"/>
      <stop offset="0.5" stop-color="#25B874"/>
      <stop offset="1" stop-color="#1F9D62"/>
    </linearGradient>

    <!-- Ambient glow -->
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.75">
      <stop offset="0" stop-color="#25B874" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#25B874" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon blur -->
    <filter id="neon" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft glow -->
    <filter id="softglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- Black rounded background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- ==================================================== -->
  <!-- BROWSER WINDOW (top) — holds the CODE symbol         -->
  <!-- ==================================================== -->
  <!-- Outer glow -->
  <rect x="68" y="76" width="376" height="248" rx="26"
        fill="none" stroke="#25B874" stroke-width="18"
        opacity="0.32" filter="url(#softglow)"/>

  <!-- Window body -->
  <rect x="68" y="76" width="376" height="248" rx="26"
        fill="#0B0F0D" stroke="url(#green)" stroke-width="14"/>

  <!-- Top highlight -->
  <path d="M 96 88 Q 256 66 416 88"
        stroke="#7DF0B5" stroke-width="2" stroke-opacity="0.4" fill="none"/>

  <!-- Traffic dots -->
  <circle cx="106" cy="112" r="8" fill="#25B874"/>
  <circle cx="132" cy="112" r="8" fill="#25B874" opacity="0.75"/>
  <circle cx="158" cy="112" r="8" fill="#25B874" opacity="0.5"/>

  <!-- Divider line -->
  <line x1="82" y1="140" x2="430" y2="140"
        stroke="#1F9D62" stroke-width="2" stroke-opacity="0.55"/>

  <!-- ===== CODE BRACKETS </> ===== -->
  <g filter="url(#neon)"
     stroke="url(#bright)" stroke-width="20"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 208 176 L 176 214 L 208 252"/>
    <path d="M 304 176 L 336 214 L 304 252"/>
    <line x1="272" y1="166" x2="240" y2="262"/>
  </g>

  <!-- ==================================================== -->
  <!-- STORE BAG (bottom-left) — holds the SHOP symbol      -->
  <!-- ==================================================== -->
  <!-- Handle glow -->
  <path d="M 122 384 Q 122 348 158 348 Q 194 348 194 384"
        stroke="#25B874" stroke-width="22"
        stroke-linecap="round" fill="none"
        opacity="0.4" filter="url(#softglow)"/>

  <!-- Handle -->
  <path d="M 122 384 Q 122 348 158 348 Q 194 348 194 384"
        stroke="url(#green)" stroke-width="16"
        stroke-linecap="round" fill="none"/>

  <!-- Handle highlight -->
  <path d="M 138 366 Q 148 356 158 356"
        stroke="#7DF0B5" stroke-width="2" stroke-opacity="0.55"
        stroke-linecap="round" fill="none"/>

  <!-- Bag body glow -->
  <path d="M 92 396 L 224 396 L 218 468 Q 216 484 200 484 L 116 484 Q 100 484 98 468 Z"
        fill="#25B874" opacity="0.3" filter="url(#softglow)"/>

  <!-- Bag body -->
  <path d="M 92 396 L 224 396 L 218 468 Q 216 484 200 484 L 116 484 Q 100 484 98 468 Z"
        fill="#0B0F0D" stroke="url(#green)" stroke-width="14"
        stroke-linejoin="round"/>

  <!-- Rim highlight -->
  <line x1="102" y1="404" x2="214" y2="404"
        stroke="#7DF0B5" stroke-width="2" stroke-opacity="0.4"/>

  <!-- ==================================================== -->
  <!-- CLOUD + UP ARROW (bottom-right) — holds PUBLISH      -->
  <!-- ==================================================== -->
  <!-- Cloud glow -->
  <path d="M 388 484
           C 358 484 344 468 350 448
           C 356 428 374 420 392 424
           C 398 390 424 368 452 368
           C 480 368 500 390 504 424
           C 508 428 508 468 484 484
           Z"
        fill="#25B874" opacity="0.3" filter="url(#softglow)"/>

  <!-- Cloud body -->
  <path d="M 388 484
           C 358 484 344 468 350 448
           C 356 428 374 420 392 424
           C 398 390 424 368 452 368
           C 480 368 500 390 504 424
           C 508 428 508 468 484 484
           Z"
        fill="url(#green)"/>

  <!-- Cloud top highlight -->
  <path d="M 408 396 Q 452 384 488 402"
        stroke="#7DF0B5" stroke-width="2" stroke-opacity="0.5"
        stroke-linecap="round" fill="none"/>

  <!-- Up arrow carved in black -->
  <g stroke="#0A0A0A" stroke-width="14"
     stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line x1="430" y1="456" x2="430" y2="418"/>
    <path d="M 414 434 L 430 418 L 446 434"/>
  </g>

</svg>
