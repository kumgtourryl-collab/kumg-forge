  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');

<style>
  .hero{
    background: linear-gradient(135deg, var(--deep), var(--green));
    border-radius: 16px;
    padding: 22px 20px;
    color: #E8F5EE;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hero-icon{
    width: 52px; height: 52px; border-radius: 14px; flex-shrink: 0;
    background: rgba(255,255,255,.15);
    display: grid; place-items: center;
  }
  .hero-icon svg{
    width: 26px; height: 26px;
    stroke: #E8F5EE; fill: none;
    stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .hero-txt{ flex: 1; min-width: 0; }
  .hero h1{
    margin: 0 0 4px;
    font-size: 20px;
    font-weight: 800;
    letter-spacing: -0.4px;
    color: #fff;
  }
  .hero p{ margin: 0; font-size: 13px; opacity: .88; line-height: 1.45; }

  .plan-note{
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin: 0 0 14px;
    padding: 8px 12px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
  }
  .plan-note.pro{
    background: rgba(31,157,98,.1);
    border-color: rgba(31,157,98,.3);
    color: var(--green);
  }

  .shop-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    gap: 14px;
    align-items: center;
    cursor: pointer;
    transition: border-color .15s;
  }
  .shop-card:hover{ border-color: var(--green); }

  .shop-logo{
    width: 56px; height: 56px; border-radius: 14px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--deep), var(--green));
    display: grid; place-items: center;
    color: #04140C;
    font-weight: 900; font-size: 22px;
    overflow: hidden;
  }
  .shop-logo img{ width: 100%; height: 100%; object-fit: cover; }

  .shop-meta{ flex: 1; min-width: 0; }
  .shop-meta .name{
    font-weight: 800; font-size: 15.5px; margin-bottom: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    color: var(--mint);
  }
  .shop-meta .sub{
    font-size: 12px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shop-meta .url{
    font-family: var(--mono);
    font-size: 11px;
    color: var(--green);
    margin-top: 4px;
  }

  .shop-status{
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 999px;
    background: var(--deep);
    color: var(--mint);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .shop-status .dot{
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
  }
  .shop-status.live{
    background: var(--green);
    color: #04140C;
  }
  .shop-status.live .dot{ background: #04140C; }

  .empty-shop-state{
    text-align: center;
    padding: 40px 20px 24px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
  }
  .empty-shop-state .ill{
    width: 72px; height: 72px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--deep), var(--green));
    display: grid; place-items: center;
    margin: 0 auto 18px;
  }
  .empty-shop-state .ill svg{
    width: 36px; height: 36px;
    stroke: #04140C; fill: none;
    stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .empty-shop-state h3{
    margin: 0 0 8px;
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.3px;
  }
  .empty-shop-state p{
    margin: 0 0 20px;
    color: var(--muted);
    font-size: 13.5px;
    line-height: 1.55;
    max-width: 300px;
    margin-left: auto;
    margin-right: auto;
  }
  .empty-shop-state .benefits{
    text-align: left;
    max-width: 320px;
    margin: 20px auto;
    padding: 14px 16px;
    background: rgba(31,157,98,.06);
    border-radius: 12px;
  }
  .empty-shop-state .benefit{
    display: flex;
    gap: 10px;
    padding: 6px 0;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.5;
  }
  .empty-shop-state .benefit svg{
    width: 16px; height: 16px; flex-shrink: 0;
    stroke: var(--green); fill: none;
    stroke-width: 2.5;
    stroke-linecap: round; stroke-linejoin: round;
    margin-top: 2px;
  }

  footer.legal{
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    padding: 24px 0;
  }
  footer.legal a{ color: var(--muted); }
</style>
</head>
<body class="has-bottom-nav">

<main class="container">

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/settings.js"></script>
<script>
var userId = null;
var userPlan = 'free';

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toast(msg){
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

async function load(){
  var listEl = document.getElementById('list');

  var profile = await db.from('profiles').select('plan').eq('id', userId).maybeSingle();
  userPlan = (profile.data && profile.data.plan) || 'free';

  var noteEl = document.getElementById('planNote');
  if (userPlan === 'pro'){
    noteEl.textContent = 'Pro plan: unlimited shops and unlimited products';
    noteEl.classList.add('pro');
  } else {
    noteEl.textContent = 'Free plan: 1 shop with up to 5 products';
    noteEl.classList.remove('pro');
  }

  var shops = await db
    .from('shops')
    .select('id, name, tagline, slug, logo_url, is_published, created_at')
    .eq('owner', userId)
    .order('created_at', { ascending: false });

  if (shops.error){
    listEl.innerHTML = '<div class="empty"><h3>Could not load shops</h3></div>';
    return;
  }

  if (!shops.data || !shops.data.length){
    listEl.innerHTML = `
      <div class="empty-shop-state">
        <div class="ill">
          <svg viewBox="0 0 24 24">
            <path d="M 4 8 h 16 l -1.5 12 a 1.6 1.6 0 0 1 -1.6 1.4 h -9.8 a 1.6 1.6 0 0 1 -1.6 -1.4 z"/>
            <path d="M 8.5 8 V 6.5 a 3.5 3.5 0 0 1 7 0 V 8"/>
          </svg>
        </div>
        <h3>Open your first shop</h3>
        <p>Turn your products into a professional online shop in under 5 minutes.</p>
        <div class="benefits">
          <div class="benefit">
            <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
            <span>Share one link on WhatsApp or social</span>
          </div>
          <div class="benefit">
            <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
            <span>Customers order directly on WhatsApp</span>
          </div>
          <div class="benefit">
            <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg>
            <span>No commissions. No hidden fees.</span>
          </div>
        </div>
        <button class="btn btn-block" id="firstShopBtn" style="max-width:280px;margin:0 auto">Create a shop</button>
      </div>
    `;
    document.getElementById('firstShopBtn').addEventListener('click', function(){
      location.href = 'store-edit.html';
    });
    return;
  }

  listEl.innerHTML = shops.data.map(function(s){
    var initial = (s.name || '?')[0].toUpperCase();
    var logo = s.logo_url ? '<img src="' + esc(s.logo_url) + '" alt="">' : initial;
    return `
      <div class="shop-card" data-id="${s.id}">
        <div class="shop-logo">${logo}</div>
        <div class="shop-meta">
          <div class="name">${esc(s.name)}</div>
          <div class="sub">${esc(s.tagline || 'No tagline yet')}</div>
          <div class="url">/store/${esc(s.slug)}</div>
        </div>
        <span class="shop-status ${s.is_published ? 'live' : ''}">
          <span class="dot"></span>
          ${s.is_published ? 'Live' : 'Draft'}
        </span>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.shop-card').forEach(function(card){
    card.addEventListener('click', function(){
      location.href = 'store-edit.html?id=' + card.dataset.id;
    });
  });

  // Add "+ New shop" button if user can create more
  if (userPlan === 'pro' || shops.data.length < 1){
    var btn = document.createElement('button');
    btn.className = 'btn btn-block';
    btn.textContent = '+ Create another shop';
    btn.style.marginTop = '16px';
    btn.addEventListener('click', function(){
      location.href = 'store-edit.html';
    });
    listEl.appendChild(btn);
  }
}

(async function(){
  var sess = await db.auth.getSession();
  if (!sess.data.session){ location.href = 'auth.html'; return; }
  userId = sess.data.session.user.id;

  var profile = await db.from('profiles').select('dob').eq('id', userId).maybeSingle();
  if (!profile.data || !profile.data.dob){ location.href = 'verify.html'; return; }

  load();
})();
</script>
