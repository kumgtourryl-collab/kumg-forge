<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Sign in — KUMG Forge</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  var l = localStorage.getItem('kumg_lang') || 'en';
  document.documentElement.setAttribute('lang', l);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KUMG">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="logo">K</div>
    <div>KUMG <span class="accent">Forge</span></div>
  </div>
</header>

<main class="container" style="max-width:420px">
  <h1 class="page-title" id="title">Welcome back</h1>
  <p class="page-sub" id="sub">Sign in to continue building.</p>

  <form id="authForm">
    <label for="email" data-i18n="auth.email">Email</label>
    <input id="email" type="email" autocomplete="email" required placeholder="you@example.com">

    <label for="password" data-i18n="auth.password">Password</label>
    <input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters">

    <button class="btn btn-block" type="submit" id="submitBtn" style="margin-top:20px">
      Sign in
    </button>
  </form>

  <p style="text-align:center;margin-top:20px;color:var(--muted);font-size:14px">
    <span id="toggleText">No account yet?</span>
    <a href="#" id="toggleLink">Create one</a>
  </p>

  <p id="msg" style="text-align:center;font-size:13px;margin-top:14px;min-height:20px"></p>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/settings.js"></script>
<script src="js/auth.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
