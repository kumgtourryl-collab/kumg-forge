<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>TouRryl Store — KUMG Forge</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  var l = localStorage.getItem('kumg_lang') || 'en';
  document.documentElement.setAttribute('lang', l);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KUMG">
<link rel="stylesheet" href="css/style.css">
<style>
  .hero{
    background:linear-gradient(135deg,var(--deep),var(--green));
    border-radius:var(--radius);
    padding:22px 20px;margin-bottom:20px;
    color:#E8F5EE;
  }
  .hero h2{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.4px}
  .hero p{margin:0;font-size:13.5px;opacity:.9;line-height:1.55}

  .shop-card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px 16px;margin-bottom:10px;
    cursor:pointer;transition:border-color .15s ease;
    display:flex;gap:14px;align-items:center;
  }
  .shop-card:hover{border-color:var(--green)}
  .shop-card .logo{
    width:52px;height:52px;border-radius:12px;flex-shrink:0;
    background:linear-gradient(135deg,var(--deep),var(--green));
    display:grid;place-items:center;color:#04140C;
    font-weight:900;font-size:20px;overflow:hidden;
  }
  .shop-card .logo img{width:100%;height:100%;object-fit:cover}
  .shop-card .meta{flex:1;min-width:0}
  .shop-card .name{
    font-weight:800;font-size:15.5px;margin-bottom:3px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .shop-card .sub{font-size:12px;color:var(--muted)}
  .shop-card .status{
    font-size:10px;font-weight:800;letter-spacing:.5px;
    text-transform:uppercase;
    padding:3px 8px;border-radius:999px;
    background:var(--deep);color:var(--mint);
    flex-shrink:0;
  }
  .shop-card .status.live{background:var(--green);color:#04140C}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Forge</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='index.html'" style="font-size:13px;padding:8px 12px">Back</button>
  </div>
</header>

<main class="container">
  <div class="hero">
    <h2>TouRryl Store</h2>
    <p>Turn your business into an online shop in 5 minutes. Share one link. Take orders on WhatsApp. Get paid.</p>
  </div>

  <h1 class="page-title" style="font-size:18px">Your shops</h1>
  <p class="page-sub" style="margin-bottom:14px">Free plan: 1 shop · 5 products</p>

  <div id="list"></div>

  <button class="btn btn-block" id="newBtn" style="margin-top:20px">+ Create a shop</button>

  <footer class="legal" style="text-align:center;font-size:12px;color:var(--muted);padding:24px 0">
    <a href="terms.html" style="color:var(--muted)">Terms</a> ·
    <a href="privacy.html" style="color:var(--muted)">Privacy</a>
  </footer>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/settings.js"></script>
<script>
let userId = null;

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

async function render(){
  const { data: shops, error } = await db
    .from('shops')
    .select('id, name, tagline, slug, logo_url, is_published, created_at')
    .order('created_at', { ascending: false });

  const listEl = document.getElementById('list');

  if (error){
    listEl.innerHTML = '<div class="empty"><h3>Could not load shops</h3></div>';
    return;
  }

  if (!shops || !shops.length){
    listEl.innerHTML = `
      <div class="empty">
        <h3>No shops yet</h3>
        <p>Create your first shop to start selling.</p>
      </div>`;
    return;
  }

  listEl.innerHTML = shops.map(s => {
    const initial = (s.name || '?')[0].toUpperCase();
    const logo = s.logo_url
      ? `<img src="${escapeHtml(s.logo_url)}" alt="">`
      : initial;
    return `
      <div class="shop-card" data-id="${s.id}">
        <div class="logo">${logo}</div>
        <div class="meta">
          <div class="name">${escapeHtml(s.name)}</div>
          <div class="sub">${escapeHtml(s.tagline || 'No tagline yet')} · /store/${escapeHtml(s.slug)}</div>
        </div>
        <span class="status ${s.is_published ? 'live' : ''}">
          ${s.is_published ? 'Live' : 'Draft'}
        </span>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.shop-card').forEach(card => {
    card.addEventListener('click', () => {
      location.href = 'store-edit.html?id=' + card.dataset.id;
    });
  });
}

document.getElementById('newBtn').addEventListener('click', () => {
  location.href = 'store-edit.html';
});

(async () => {
  const { data } = await db.auth.getSession();
  if (!data.session){ location.href = 'auth.html'; return; }
  userId = data.session.user.id;

  // ensure age gate
  const { data: profile } = await db
    .from('profiles')
    .select('dob')
    .eq('id', userId)
    .maybeSingle();
  if (!profile?.dob){ location.href = 'verify.html'; return; }

  render();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
