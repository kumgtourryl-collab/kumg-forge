<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Publish — KUMG Forge</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  var l = localStorage.getItem('kumg_lang') || 'en';
  document.documentElement.setAttribute('lang', l);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KUMG">
<link rel="stylesheet" href="css/style.css">
<style>
  .domain-row{display:flex;align-items:center;gap:8px}
  .domain-row input{flex:1}
  .domain-row .suffix{
    background:var(--card);border:1px solid var(--line);
    padding:12px 14px;border-radius:var(--radius);
    color:var(--muted);font-size:14px;white-space:nowrap;
  }
  .status-line{margin-top:12px;font-size:13px;min-height:20px}
  .status-line.err{color:var(--danger)}
  .status-line.ok{color:var(--green)}
  .live-box{
    background:var(--deep);border:1px solid var(--green);
    border-radius:var(--radius);padding:16px;margin-top:16px;
    display:none;color:#E8F5EE;
  }
  [data-theme="light"] .live-box{color:#FFFFFF}
  .live-box.show{display:block}
  .live-box a{color:#E8F5EE;font-weight:700;word-break:break-all}
  [data-theme="light"] .live-box a{color:#FFFFFF}
  .live-box .row{display:flex;gap:8px;margin-top:12px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Forge</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='index.html'" style="font-size:13px;padding:8px 12px" data-i18n="common.back">Back</button>
  </div>
</header>

<main class="container" style="max-width:520px">
  <h1 class="page-title">Publish your site</h1>
  <p class="page-sub" id="projName">Loading…</p>

  <div class="card">
    <h3>Choose your address</h3>
    <p style="margin-bottom:12px">Pick a name. This becomes your live URL.</p>

    <div class="domain-row">
      <input id="subInput" type="text" placeholder="yourname" maxlength="30" autocapitalize="off" autocorrect="off">
      <div class="suffix">.kumg.app</div>
    </div>

    <div class="status-line" id="statusLine"></div>

    <button class="btn btn-block" id="publishBtn" style="margin-top:16px">Publish</button>
  </div>

  <div class="live-box" id="liveBox">
    <div style="font-weight:800;margin-bottom:6px">🎉 Your site is live</div>
    <a id="liveUrl" href="#" target="_blank" rel="noopener"></a>
    <div class="row">
      <button class="btn-ghost" id="copyBtn" style="flex:1">Copy link</button>
      <button class="btn-ghost" id="openBtn" style="flex:1">Open</button>
    </div>
    <button class="btn-danger btn-block" id="unpublishBtn" style="margin-top:12px">Unpublish</button>
  </div>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/settings.js"></script>
<script src="js/projects.js"></script>
<script src="js/publish.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
