<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Profile — KUMG Forge</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  var l = localStorage.getItem('kumg_lang') || 'en';
  document.documentElement.setAttribute('lang', l);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KUMG">
<link rel="stylesheet" href="css/style.css">
<style>
  .avatar-wrap{text-align:center;margin-bottom:22px}
  .avatar{
    width:104px;height:104px;border-radius:50%;
    background:linear-gradient(135deg,var(--deep),var(--green));
    display:grid;place-items:center;margin:0 auto 10px;
    font-size:38px;font-weight:900;color:#04140C;
    overflow:hidden;position:relative;cursor:pointer;
    border:2px solid var(--green);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar .letter{display:block;line-height:1}
  .avatar .edit{
    position:absolute;bottom:-2px;right:-2px;
    background:var(--green);color:#04140C;
    width:32px;height:32px;border-radius:50%;
    display:grid;place-items:center;font-size:14px;
    border:3px solid var(--black);
  }
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:20px 0}
  .stat{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 8px;text-align:center;
  }
  .stat .num{font-size:22px;font-weight:800;color:var(--green)}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.6px}
  .row{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 0;border-bottom:1px solid var(--line);
  }
  .row:last-child{border-bottom:0}
  .row .label{font-size:14px;color:var(--muted)}
  .row .value{font-weight:700;font-size:15px}
  .dob-row{
    display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;
    margin-bottom:10px;
  }
  .dob-row label{
    display:block;font-size:11px;color:var(--muted);
    text-transform:uppercase;letter-spacing:1px;font-weight:700;
    margin-bottom:6px;
  }
  .dob-row input{
    text-align:center;font-family:var(--mono);letter-spacing:2px;
  }
  .avatar-actions{
    display:flex;gap:8px;justify-content:center;margin-top:6px;
  }
  .avatar-actions button{
    font-size:12px;padding:7px 14px;border-radius:10px;
    font-weight:700;
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Forge</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='settings.html'" style="font-size:13px;padding:8px 12px">Back</button>
  </div>
</header>

<main class="container" style="max-width:520px">
  <div class="avatar-wrap">
    <div class="avatar" id="avatar">
      <span class="letter" id="avatarLetter">?</span>
      <div class="edit">✎</div>
    </div>
    <input id="fileInput" type="file" accept="image/*" style="display:none">
    <p style="font-size:12px;color:var(--muted);margin:0">Tap to change photo</p>
    <div class="avatar-actions" id="avatarActions" style="display:none">
      <button class="btn-ghost" id="removeAvatarBtn">Remove photo</button>
    </div>
  </div>

  <div class="card">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="yourname" maxlength="30" autocapitalize="off" autocorrect="off">

    <label for="bio">Bio</label>
    <textarea id="bio" rows="3" maxlength="160" placeholder="A short line about you."></textarea>

    <button class="btn btn-block" id="saveBtn" style="margin-top:16px">Save changes</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statProjects">0</div><div class="lbl">Projects</div></div>
    <div class="stat"><div class="num" id="statPublished">0</div><div class="lbl">Live</div></div>
    <div class="stat"><div class="num" id="statDays">0</div><div class="lbl">Days</div></div>
  </div>

  <div class="card">
    <div class="row" onclick="location.href='settings.html'" style="cursor:pointer">
      <div class="label">Settings</div>
      <div class="value">Open →</div>
    </div>
    <div class="row">
      <div class="label">Email</div>
      <div class="value" id="emailVal" style="word-break:break-all">—</div>
    </div>
    <div class="row" id="dobRow" style="cursor:pointer">
      <div class="label">Date of birth</div>
      <div class="value" id="dobVal">—</div>
    </div>
    <div class="row">
      <div class="label">Plan</div>
      <div class="value" id="planVal">Free</div>
    </div>
  </div>

  <footer class="legal" style="text-align:center;font-size:12px;color:var(--muted);padding:24px 0">
    <a href="terms.html" style="color:var(--muted)">Terms</a> ·
    <a href="privacy.html" style="color:var(--muted)">Privacy</a>
  </footer>
</main>

<!-- DOB modal -->
<div id="dobModal" style="position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;width:100%;max-width:400px">
    <h3 style="margin:0 0 4px">Date of birth</h3>
    <p style="margin:0 0 14px;color:var(--muted);font-size:13px">Must be 13 or older.</p>
    <div class="dob-row">
      <div>
        <label>Day</label>
        <input id="pDd" type="text" inputmode="numeric" maxlength="2" placeholder="DD">
      </div>
      <div>
        <label>Month</label>
        <input id="pMm" type="text" inputmode="numeric" maxlength="2" placeholder="MM">
      </div>
      <div>
        <label>Year</label>
        <input id="pYyyy" type="text" inputmode="numeric" maxlength="4" placeholder="YYYY">
      </div>
    </div>
    <p id="dobMsg" style="font-size:12px;min-height:18px;margin:0 0 12px"></p>
    <div style="display:flex;gap:8px">
      <button class="btn-ghost" id="dobCancel" style="flex:1">Cancel</button>
      <button id="dobSave" style="flex:1">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/settings.js"></script>
<script>
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

let userId = null;
let currentDob = null;

async function init(){
  const { data } = await db.auth.getSession();
  if (!data.session){ location.href = 'auth.html'; return; }
  userId = data.session.user.id;
  document.getElementById('emailVal').textContent = data.session.user.email;

  const { data: profile } = await db
    .from('profiles')
    .select('username, plan, bio, avatar_url, dob, created_at')
    .eq('id', userId)
    .maybeSingle();

  if (profile){
    document.getElementById('username').value = profile.username || '';
    document.getElementById('bio').value = profile.bio || '';
    document.getElementById('planVal').textContent = (profile.plan === 'pro' ? 'Pro' : 'Free');

    if (profile.dob){
      currentDob = profile.dob;
      const [y,m,d] = profile.dob.split('-');
      document.getElementById('dobVal').textContent = `${d}/${m}/${y}`;
      document.getElementById('pDd').value = d;
      document.getElementById('pMm').value = m;
      document.getElementById('pYyyy').value = y;
    }

    if (profile.avatar_url){
      showAvatar(profile.avatar_url);
    } else {
      showInitial((profile.username || data.session.user.email || '?')[0].toUpperCase());
    }

    if (profile.created_at){
      const days = Math.max(1, Math.floor((Date.now() - new Date(profile.created_at).getTime()) / 86400000));
      document.getElementById('statDays').textContent = days;
    }
  }

  const { count: projCount } = await db
    .from('projects').select('*', { count: 'exact', head: true })
    .eq('owner', userId);
  document.getElementById('statProjects').textContent = projCount || 0;

  const { count: pubCount } = await db
    .from('projects').select('*', { count: 'exact', head: true })
    .eq('owner', userId)
    .eq('is_published', true);
  document.getElementById('statPublished').textContent = pubCount || 0;
}

function showAvatar(url){
  const av = document.getElementById('avatar');
  av.innerHTML = `<img src="${url}" alt=""><div class="edit">✎</div>`;
  document.getElementById('avatarActions').style.display = 'flex';
}

function showInitial(letter){
  const av = document.getElementById('avatar');
  av.innerHTML = `<span class="letter">${letter}</span><div class="edit">✎</div>`;
  document.getElementById('avatarActions').style.display = 'none';
}

// Upload avatar
document.getElementById('avatar').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024){ toast('Max 5MB'); return; }
  if (!file.type.startsWith('image/')){ toast('Must be an image'); return; }

  toast('Uploading…');
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = userId + '/avatar.' + ext;

  const { error } = await db.storage
    .from('user-media')
    .upload(path, file, { upsert: true, cacheControl: '3600' });

  if (error){ toast(error.message || 'Upload failed'); return; }

  const { data: urlData } = db.storage.from('user-media').getPublicUrl(path);
  const publicUrl = urlData.publicUrl + '?t=' + Date.now();

  const { error: upErr } = await db
    .from('profiles')
    .update({ avatar_url: publicUrl })
    .eq('id', userId);
  if (upErr){ toast(upErr.message || 'Save failed'); return; }

  showAvatar(publicUrl);
  toast('Photo updated');
});

// Remove avatar
document.getElementById('removeAvatarBtn').addEventListener('click', async () => {
  if (!confirm('Remove your profile photo? You can upload a new one any time.')) return;
  try {
    const { error } = await db.from('profiles').update({ avatar_url: null }).eq('id', userId);
    if (error) throw error;

    const letter = (document.getElementById('username').value.trim() || '?')[0].toUpperCase();
    showInitial(letter);
    toast('Photo removed');
  } catch(err){
    toast(err.message || 'Remove failed');
  }
});

// Save profile
document.getElementById('saveBtn').addEventListener('click', async () => {
  const username = document.getElementById('username').value
    .trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const bio = document.getElementById('bio').value.trim();

  if (username && username.length < 3){
    toast('Username must be 3+ characters');
    return;
  }

  try {
    const { error } = await db.from('profiles')
      .update({ username: username || null, bio })
      .eq('id', userId);
    if (error) throw error;
    toast('Saved');
  } catch(err){
    toast(err.message || 'Save failed');
  }
});

// DOB edit
const dobModal = document.getElementById('dobModal');
const pDd = document.getElementById('pDd');
const pMm = document.getElementById('pMm');
const pYyyy = document.getElementById('pYyyy');
const dobMsg = document.getElementById('dobMsg');

[pDd, pMm, pYyyy].forEach(el => {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/[^0-9]/g,'');
  });
});
pDd.addEventListener('input', () => { if (pDd.value.length === 2) pMm.focus(); });
pMm.addEventListener('input', () => { if (pMm.value.length === 2) pYyyy.focus(); });

document.getElementById('dobRow').addEventListener('click', () => {
  dobMsg.textContent = '';
  dobModal.style.display = 'flex';
});
document.getElementById('dobCancel').addEventListener('click', () => {
  dobModal.style.display = 'none';
});
dobModal.addEventListener('click', (e) => {
  if (e.target === dobModal) dobModal.style.display = 'none';
});

document.getElementById('dobSave').addEventListener('click', async () => {
  dobMsg.textContent = '';
  const d = parseInt(pDd.value, 10);
  const m = parseInt(pMm.value, 10);
  const y = parseInt(pYyyy.value, 10);

  if (!d || !m || !y || pYyyy.value.length !== 4){
    dobMsg.textContent = 'Please fill in all three fields.';
    dobMsg.style.color = 'var(--danger)';
    return;
  }
  if (m < 1 || m > 12 || d < 1 || d > 31){
    dobMsg.textContent = 'Invalid day or month.';
    dobMsg.style.color = 'var(--danger)';
    return;
  }
  const dobStr = `${y.toString().padStart(4,'0')}-${m.toString().padStart(2,'0')}-${d.toString().padStart(2,'0')}`;
  const dobDate = new Date(dobStr + 'T00:00:00Z');
  if (dobDate.getUTCDate() !== d || dobDate.getUTCMonth() + 1 !== m || dobDate.getUTCFullYear() !== y){
    dobMsg.textContent = 'That date does not exist.';
    dobMsg.style.color = 'var(--danger)';
    return;
  }

  try {
    const { error } = await db.from('profiles')
      .update({ dob: dobStr, age_verified: true })
      .eq('id', userId);
    if (error) throw error;

    currentDob = dobStr;
    document.getElementById('dobVal').textContent =
      `${pDd.value.padStart(2,'0')}/${pMm.value.padStart(2,'0')}/${pYyyy.value}`;
    dobModal.style.display = 'none';
    toast('Date of birth updated');
  } catch(err){
    const raw = (err?.message || 'Failed').toString();
    dobMsg.textContent = /13/.test(raw) ? 'You must be at least 13.' : raw;
    dobMsg.style.color = 'var(--danger)';
  }
});

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
