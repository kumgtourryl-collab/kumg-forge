<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Templates — KUMG Forge</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  var l = localStorage.getItem('kumg_lang') || 'en';
  document.documentElement.setAttribute('lang', l);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
<style>
  .tpl-grid{
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }
  @media(min-width:560px){ .tpl-grid{ grid-template-columns: 1fr 1fr; } }

  .tpl{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 0;
    cursor: pointer;
    transition: all .15s ease;
    text-align: left;
    color: inherit;
    font-family: inherit;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .tpl:hover{ border-color: var(--green); }
  .tpl:active{ transform: scale(.99); }

  .tpl .preview{
    height: 92px;
    background: linear-gradient(135deg, var(--deep), var(--green));
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .tpl .preview svg{
    width: 40px;
    height: 40px;
    stroke: rgba(255,255,255,.85);
    fill: none;
    stroke-width: 1.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .tpl .body{
    padding: 14px 16px 16px;
  }
  .tpl .tag{
    display: inline-block;
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--green);
    background: rgba(31,157,98,.12);
    padding: 3px 8px;
    border-radius: 999px;
    margin-bottom: 8px;
  }
  .tpl h3{
    margin: 0 0 6px;
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: -0.2px;
  }
  .tpl p{
    margin: 0;
    color: var(--muted);
    font-size: 12.5px;
    line-height: 1.5;
  }
  .tpl .use{
    margin-top: 12px;
    font-size: 12.5px;
    color: var(--green);
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tpl .use svg{
    width: 14px;
    height: 14px;
    stroke: var(--green);
    fill: none;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .modal-bg{
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-bg.show{ display: flex; }
  .modal{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px;
    width: 100%;
    max-width: 400px;
  }
  .modal h3{ margin: 0 0 4px; font-size: 17px; }
  .modal p{ margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .modal-actions{
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }
  .modal-actions button{ flex: 1; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Forge</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='index.html'" style="font-size:13px;padding:8px 12px">Back</button>
  </div>
</header>

<main class="container">
  <h1 class="page-title">Start from a template</h1>
  <p class="page-sub">Pick one. Give it a name. Edit in seconds.</p>

  <div class="tpl-grid" id="grid"></div>
</main>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">New project</h3>
    <p id="modalSub">Give your new project a name.</p>
    <label for="projName">Project name</label>
    <input id="projName" type="text" placeholder="My Site" maxlength="60">
    <div class="modal-actions">
      <button class="btn-ghost" id="cancelBtn">Cancel</button>
      <button id="createBtn">Create</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/settings.js"></script>
<script src="js/projects.js"></script>
<script src="js/templates-data.js"></script>
<script>
let picked = null;

const gridEl = document.getElementById('grid');
const modalBg = document.getElementById('modalBg');
const nameEl = document.getElementById('projName');
const modalTitle = document.getElementById('modalTitle');
const modalSub = document.getElementById('modalSub');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

const ICONS = {
  'Landing':  '<svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>',
  'Personal': '<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>',
  'Social':   '<svg viewBox="0 0 24 24"><path d="M20 4H4a1 1 0 0 0-1 1v14l4-4h13a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1z"/></svg>',
  'Business': '<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>',
  'Product':  '<svg viewBox="0 0 24 24"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.3 7L12 12l8.7-5"/><path d="M12 22V12"/></svg>',
  'Event':    '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M8 3v4"/><path d="M16 3v4"/></svg>',
  'Food':     '<svg viewBox="0 0 24 24"><path d="M4 3v7a3 3 0 0 0 3 3v8"/><path d="M8 3v10"/><path d="M17 3c-1.5 2-2 3.5-2 5s.5 2.5 2 4v9"/></svg>',
  'Community':'<svg viewBox="0 0 24 24"><path d="M12 2L3 7v10l9 5 9-5V7z"/><path d="M12 22V12"/><path d="M3 7l9 5 9-5"/></svg>'
};

if (typeof KUMG_TEMPLATES === 'undefined'){
  gridEl.innerHTML = '<div class="empty"><h3>Templates failed to load</h3><p>Check that js/templates-data.js is uploaded.</p></div>';
} else {
  gridEl.innerHTML = KUMG_TEMPLATES.map(function(t){
    const icon = ICONS[t.tag] || ICONS['Landing'];
    return `
      <button class="tpl" data-id="${t.id}" type="button">
        <div class="preview">${icon}</div>
        <div class="body">
          <span class="tag">${t.tag}</span>
          <h3>${t.name}</h3>
          <p>${t.desc}</p>
          <div class="use">Use this template
            <svg viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
          </div>
        </div>
      </button>
    `;
  }).join('');

  gridEl.querySelectorAll('.tpl').forEach(function(card){
    card.addEventListener('click', function(){
      picked = findTemplate(card.dataset.id);
      if (!picked) return;
      modalTitle.textContent = picked.name;
      modalSub.textContent = 'Give your new project a name.';
      nameEl.value = picked.name;
      modalBg.classList.add('show');
      setTimeout(function(){ nameEl.focus(); }, 100);
    });
  });
}

document.getElementById('cancelBtn').addEventListener('click', function(){
  modalBg.classList.remove('show');
});

nameEl.addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('createBtn').click();
});

document.getElementById('createBtn').addEventListener('click', async function(){
  const name = nameEl.value.trim();
  if (!name){ toast('Name required'); return; }
  if (!picked){ toast('Pick a template first'); return; }

  const btn = document.getElementById('createBtn');
  btn.disabled = true;
  btn.textContent = 'Creating…';

  try {
    const user = await getCurrentUser();
    if (!user){ location.href = 'auth.html'; return; }

    const p = await createProject(name);
    await updateProject(p.id, { html: picked.html, css: '', js: '' });

    modalBg.classList.remove('show');
    toast('Project created');
    location.href = 'editor.html?id=' + p.id;
  } catch(err){
    console.error(err);
    toast(err.message || 'Create failed');
    btn.disabled = false;
    btn.textContent = 'Create';
  }
});

(async function(){
  const sess = await db.auth.getSession();
  if (!sess.data.session) location.href = 'auth.html';
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
