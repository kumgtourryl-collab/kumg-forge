<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Edit shop — TouRryl Store</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  var l = localStorage.getItem('kumg_lang') || 'en';
  document.documentElement.setAttribute('lang', l);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KUMG">
<link rel="stylesheet" href="css/style.css">
<style>
  .logo-picker{
    display:flex;align-items:center;gap:14px;
    padding:14px 0;
  }
  .logo-preview{
    width:72px;height:72px;border-radius:16px;flex-shrink:0;
    background:linear-gradient(135deg,var(--deep),var(--green));
    display:grid;place-items:center;color:#04140C;
    font-weight:900;font-size:28px;overflow:hidden;
    cursor:pointer;border:2px solid var(--green);
  }
  .logo-preview img{width:100%;height:100%;object-fit:cover}
  .logo-actions{flex:1;min-width:0}
  .logo-actions .hint{font-size:12px;color:var(--muted);margin:0 0 8px}

  .theme-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
  .theme-chip{
    width:38px;height:38px;border-radius:12px;border:2px solid transparent;
    cursor:pointer;position:relative;
  }
  .theme-chip.active{border-color:var(--green)}
  .theme-chip.green{background:linear-gradient(135deg,#0B3D2E,#1F9D62)}
  .theme-chip.dark{background:linear-gradient(135deg,#0A0A0A,#1A1A1A)}
  .theme-chip.light{background:linear-gradient(135deg,#FFFFFF,#E8F5EE)}
  .theme-chip.gold{background:linear-gradient(135deg,#7A5A10,#E5B93D)}
  .theme-chip.red{background:linear-gradient(135deg,#6B1F1F,#E5484D)}

  .actions{
    display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;
  }
  .actions button{flex:1;min-width:140px}

  .danger-zone{
    margin-top:32px;padding-top:20px;border-top:1px solid var(--line);
  }
  .danger-zone h3{color:var(--danger);font-size:14px;margin:0 0 10px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <a href="store.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Store</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='store.html'" style="font-size:13px;padding:8px 12px">Back</button>
  </div>
</header>

<main class="container" style="max-width:560px">
  <h1 class="page-title" id="pageTitle">New shop</h1>
  <p class="page-sub">Set up your shop details. You can change everything later.</p>

  <div class="card">
    <div class="logo-picker">
      <div class="logo-preview" id="logoPreview">
        <span id="logoLetter">?</span>
      </div>
      <div class="logo-actions">
        <p class="hint">Shop logo (optional). Max 2MB.</p>
        <button class="btn-ghost" id="logoBtn" style="font-size:13px;padding:8px 12px">Upload logo</button>
        <input id="logoInput" type="file" accept="image/*" style="display:none">
      </div>
    </div>

    <label for="name">Shop name *</label>
    <input id="name" type="text" placeholder="e.g. Mama Chido Fashions" maxlength="60" required>

    <label for="tagline">Tagline</label>
    <input id="tagline" type="text" placeholder="e.g. Quality clothes, fair prices" maxlength="90">

    <label for="slug">Shop link</label>
    <div style="display:flex;align-items:center;gap:8px">
      <input id="slug" type="text" placeholder="mama-chido" maxlength="40" autocapitalize="off" autocorrect="off" style="flex:1">
    </div>
    <p style="font-size:12px;color:var(--muted);margin:6px 0 0">
      Your shop will be at <span id="slugPreview" style="color:var(--green);font-weight:700">your-shop</span>.kumg.app
    </p>

    <label for="whatsapp">WhatsApp number *</label>
    <input id="whatsapp" type="tel" placeholder="+263 77 123 4567" autocapitalize="off">

    <label for="ecocash">EcoCash number (for receiving payments)</label>
    <input id="ecocash" type="tel" placeholder="077 123 4567" autocapitalize="off">

    <label for="delivery">Delivery info</label>
    <textarea id="delivery" rows="2" placeholder="e.g. Delivery in Harare $2. Bulawayo $4." maxlength="200"></textarea>

    <label>Theme</label>
    <div class="theme-row" id="themeRow">
      <div class="theme-chip green active" data-theme="green"></div>
      <div class="theme-chip dark" data-theme="dark"></div>
      <div class="theme-chip light" data-theme="light"></div>
      <div class="theme-chip gold" data-theme="gold"></div>
      <div class="theme-chip red" data-theme="red"></div>
    </div>
  </div>

  <div class="actions">
    <button class="btn-ghost" id="saveDraftBtn">Save as draft</button>
    <button class="btn" id="savePublishBtn">Save &amp; publish</button>
  </div>

  <button class="btn-ghost btn-block" id="productsBtn" style="margin-top:12px;display:none">
    Manage products →
  </button>

  <div class="danger-zone" id="dangerZone" style="display:none">
    <h3>Danger zone</h3>
    <button class="btn-danger btn-block" id="deleteBtn">Delete this shop</button>
  </div>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/settings.js"></script>
<script>
let userId = null;
let shopId = null;
let selectedTheme = 'green';
let logoDataUrl = null;
let currentLogoUrl = null;

const nameEl = document.getElementById('name');
const taglineEl = document.getElementById('tagline');
const slugEl = document.getElementById('slug');
const whatsappEl = document.getElementById('whatsapp');
const ecocashEl = document.getElementById('ecocash');
const deliveryEl = document.getElementById('delivery');
const pageTitle = document.getElementById('pageTitle');
const slugPreview = document.getElementById('slugPreview');
const themeRow = document.getElementById('themeRow');

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

function slugify(str){
  return String(str || '')
    .toLowerCase()
    .replace(/[^a-z0-9-]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 40);
}

nameEl.addEventListener('input', () => {
  const initial = (nameEl.value.trim()[0] || '?').toUpperCase();
  document.getElementById('logoLetter').textContent = initial;
  if (!shopId){
    const s = slugify(nameEl.value);
    slugEl.value = s;
    slugPreview.textContent = s || 'your-shop';
  }
});

slugEl.addEventListener('input', () => {
  slugEl.value = slugify(slugEl.value);
  slugPreview.textContent = slugEl.value || 'your-shop';
});

// Theme
themeRow.querySelectorAll('.theme-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    themeRow.querySelectorAll('.theme-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    selectedTheme = chip.dataset.theme;
  });
});

// Logo upload
document.getElementById('logoBtn').addEventListener('click', () => {
  document.getElementById('logoInput').click();
});

document.getElementById('logoInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024){ toast('Max 2MB'); return; }
  if (!file.type.startsWith('image/')){ toast('Must be an image'); return; }

  toast('Uploading…');
  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const path = userId + '/shop-logo-' + Date.now() + '.' + ext;

  const { error } = await db.storage
    .from('shop-images')
    .upload(path, file, { upsert: true, cacheControl: '3600' });

  if (error){ toast(error.message || 'Upload failed'); return; }

  const { data: urlData } = db.storage.from('shop-images').getPublicUrl(path);
  currentLogoUrl = urlData.publicUrl;
  const prev = document.getElementById('logoPreview');
  prev.innerHTML = `<img src="${currentLogoUrl}" alt="">`;
  toast('Logo uploaded');
});

// Load existing shop
async function loadShop(){
  const id = new URLSearchParams(location.search).get('id');
  if (!id) return;

  shopId = id;
  pageTitle.textContent = 'Edit shop';
  document.getElementById('productsBtn').style.display = 'block';
  document.getElementById('dangerZone').style.display = 'block';

  const { data, error } = await db
    .from('shops')
    .select('*')
    .eq('id', id)
    .single();

  if (error || !data){ toast('Shop not found'); setTimeout(()=> location.href='store.html', 900); return; }

  nameEl.value = data.name || '';
  taglineEl.value = data.tagline || '';
  slugEl.value = data.slug || '';
  whatsappEl.value = data.whatsapp || '';
  ecocashEl.value = data.ecocash || '';
  deliveryEl.value = data.delivery_info || '';
  currentLogoUrl = data.logo_url || null;
  selectedTheme = data.theme || 'green';

  slugPreview.textContent = data.slug || 'your-shop';

  themeRow.querySelectorAll('.theme-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.theme === selectedTheme);
  });

  const initial = (data.name || '?')[0].toUpperCase();
  const prev = document.getElementById('logoPreview');
  if (data.logo_url){
    prev.innerHTML = `<img src="${data.logo_url}" alt="">`;
  } else {
    prev.innerHTML = `<span>${initial}</span>`;
  }
}

// Save
async function save(publish){
  const name = nameEl.value.trim();
  const slug = slugEl.value.trim();
  const whatsapp = whatsappEl.value.trim();

  if (!name){ toast('Shop name required'); return; }
  if (slug.length < 3){ toast('Shop link must be 3+ characters'); return; }
  if (!whatsapp){ toast('WhatsApp number required'); return; }

  const payload = {
    owner: userId,
    name,
    tagline: taglineEl.value.trim(),
    slug,
    whatsapp,
    ecocash: ecocashEl.value.trim(),
    delivery_info: deliveryEl.value.trim(),
    theme: selectedTheme,
    logo_url: currentLogoUrl,
    is_published: !!publish
  };

  try {
    if (shopId){
      const { error } = await db.from('shops').update(payload).eq('id', shopId);
      if (error) throw error;
    } else {
      // Free plan check — 1 shop
      const { data: profile } = await db
        .from('profiles').select('plan').eq('id', userId).single();
      const plan = profile?.plan || 'free';
      if (plan === 'free'){
        const { count } = await db
          .from('shops').select('*', { count: 'exact', head: true })
          .eq('owner', userId);
        if ((count || 0) >= 1){
          toast('Free plan: 1 shop. Upgrade to Pro for unlimited.');
          return;
        }
      }

      const { data, error } = await db.from('shops').insert(payload).select().single();
      if (error) throw error;
      shopId = data.id;
      history.replaceState({}, '', 'store-edit.html?id=' + shopId);
      pageTitle.textContent = 'Edit shop';
      document.getElementById('productsBtn').style.display = 'block';
      document.getElementById('dangerZone').style.display = 'block';
    }

    toast(publish ? 'Shop published ✅' : 'Draft saved');
  } catch(err){
    console.error(err);
    toast(err.message || 'Save failed');
  }
}

document.getElementById('saveDraftBtn').addEventListener('click', () => save(false));
document.getElementById('savePublishBtn').addEventListener('click', () => save(true));

document.getElementById('productsBtn').addEventListener('click', () => {
  location.href = 'store-products.html?id=' + shopId;
});

document.getElementById('deleteBtn').addEventListener('click', async () => {
  if (!shopId) return;
  if (!confirm('Delete this shop and all its products? This cannot be undone.')) return;
  const { error } = await db.from('shops').delete().eq('id', shopId);
  if (error){ toast(error.message || 'Delete failed'); return; }
  toast('Shop deleted');
  setTimeout(()=> location.href = 'store.html', 700);
});

(async () => {
  const { data } = await db.auth.getSession();
  if (!data.session){ location.href = 'auth.html'; return; }
  userId = data.session.user.id;

  await loadShop();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
