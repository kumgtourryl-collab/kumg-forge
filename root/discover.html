<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Discover Shops — KUMG</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
})();
</script>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
<style>
  body.discover{ min-height: 100vh; background: var(--black); }

  .discover-hero{
    background: linear-gradient(160deg, var(--deep), var(--green));
    padding: 26px 20px 28px;
    color: #E8F5EE;
    border-radius: 0 0 24px 24px;
  }
  .discover-hero .brand{
    display: flex; align-items: center; gap: 10px;
    font-weight: 800; font-size: 15px;
    margin-bottom: 16px;
  }
  .discover-hero .brand .logo{
    width: 30px; height: 30px; border-radius: 9px;
    background: rgba(255,255,255,.15);
    display: grid; place-items: center;
    color: #04140C; font-weight: 900; font-size: 14px;
  }
  .discover-hero h1{
    margin: 0 0 6px; font-size: 24px; font-weight: 800;
    letter-spacing: -0.5px; line-height: 1.15;
  }
  .discover-hero p{
    margin: 0 0 18px; font-size: 13.5px; opacity: .9; line-height: 1.5;
  }

  .search-wrap{
    position: relative;
    background: rgba(0,0,0,.25);
    border-radius: 999px;
    padding: 4px 4px 4px 18px;
    display: flex; align-items: center; gap: 10px;
  }
  .search-wrap svg{
    width: 18px; height: 18px; flex-shrink: 0;
    stroke: rgba(255,255,255,.75); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }
  .search-wrap input{
    flex: 1; min-width: 0;
    background: transparent; border: 0;
    color: #fff; font-size: 14.5px;
    padding: 10px 0;
    font-family: var(--font);
    outline: none;
  }
  .search-wrap input::placeholder{ color: rgba(255,255,255,.6); }

  .shops-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 16px 16px 100px;
    max-width: 900px;
    margin: 0 auto;
  }
  @media(min-width:640px){ .shops-grid{ grid-template-columns: 1fr 1fr 1fr; } }

  .shop-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    transition: transform .05s ease, border-color .15s ease;
  }
  .shop-card:active{ transform: scale(.98); }
  .shop-card:hover{ border-color: var(--green); }

  .shop-card .banner{
    width: 100%; aspect-ratio: 16/9;
    background: linear-gradient(135deg, var(--deep), var(--green));
    display: grid; place-items: center;
    color: #fff; font-weight: 900; font-size: 32px;
    overflow: hidden; position: relative;
  }
  .shop-card .banner img{
    width: 100%; height: 100%; object-fit: cover;
    position: absolute; inset: 0;
  }

  .shop-card .body{
    padding: 10px 12px 12px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .shop-card .nm{
    font-weight: 800; font-size: 14px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .shop-card .tag{
    font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-height: 16px;
  }

  .empty-discover{
    text-align: center; padding: 60px 24px; color: var(--muted);
    max-width: 420px; margin: 0 auto;
  }
  .empty-discover h3{ color: var(--mint); margin: 0 0 8px; font-size: 18px; }
  .empty-discover p{ margin: 0 0 20px; font-size: 13.5px; line-height: 1.6; }

  .cta-banner{
    margin: 24px 16px 100px;
    max-width: 500px;
    margin-left: auto;
    margin-right: auto;
    padding: 22px;
    background: linear-gradient(135deg, var(--deep), var(--green));
    border-radius: 16px;
    color: #E8F5EE;
    text-align: center;
  }
  .cta-banner h3{ margin: 0 0 6px; font-size: 16px; font-weight: 800; color: #E8F5EE; }
  .cta-banner p{ margin: 0 0 14px; font-size: 13px; opacity: .9; line-height: 1.5; }
  .cta-banner a{
    display: inline-block;
    background: #fff; color: #04140C;
    padding: 11px 20px; border-radius: 12px;
    font-weight: 800; font-size: 13.5px;
    text-decoration: none;
  }

  /* Bottom nav */
  .bottom-nav{
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(10,10,10,.96);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line);
    display: flex;
    align-items: stretch;
    padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
    z-index: 30;
  }
  [data-theme="light"] .bottom-nav{ background: rgba(255,255,255,.96); }
  .bottom-nav .nav-item{
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; padding: 8px 2px;
    color: var(--muted);
    text-decoration: none; background: transparent; border: 0;
    font-family: inherit; font-size: 10px; font-weight: 600;
    cursor: pointer;
  }
  .bottom-nav .nav-item svg{
    width: 22px; height: 22px;
    stroke-width: 1.9; stroke: currentColor; fill: none;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .bottom-nav .nav-item.active{ color: var(--green); }
  .bottom-nav .nav-item.active svg{ stroke-width: 2.4; }
</style>
</head>
<body class="discover">

<div class="discover-hero">
  <div class="brand">
    <div class="logo">K</div>
    <div>Discover</div>
  </div>
  <h1>Shop from real people</h1>
  <p>Every shop is run by a KUMG user. Order on WhatsApp.</p>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="text" placeholder="Search shops…" autocapitalize="off" autocorrect="off">
  </div>
</div>

<div id="content">
  <div class="empty-discover">
    <p>Loading shops…</p>
  </div>
</div>

<nav class="bottom-nav">
  <a class="nav-item" href="index.html">
    <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M9 21v-6h6v6"/></svg>
    <span>Home</span>
  </a>
  <a class="nav-item" href="discover.html" style="color:var(--green)">
    <svg viewBox="0 0 24 24" style="stroke-width:2.4"><circle cx="12" cy="12" r="9"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18z"/><path d="M3 12h18"/></svg>
    <span>Discover</span>
  </a>
  <a class="nav-item" href="store.html">
    <svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9z"/><path d="M9 21v-6h6v6"/></svg>
    <span>My shops</span>
  </a>
  <a class="nav-item" href="wallet.html">
    <svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="16" cy="15" r="1"/></svg>
    <span>Wallet</span>
  </a>
  <a class="nav-item" href="ai.html">
    <svg viewBox="0 0 24 24"><path d="M12 3l1.7 5.3L19 10l-5.3 1.7L12 17l-1.7-5.3L5 10l5.3-1.7z"/><path d="M19 15.5l.5 1.5 1.5.5-1.5.5-.5 1.5-.5-1.5-1.5-.5 1.5-.5z"/></svg>
    <span>AI</span>
  </a>
</nav>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
const STORE_BASE = 'https://kumg-forge.onrender.com/store/';

const contentEl = document.getElementById('content');
const searchEl = document.getElementById('search');

let allShops = [];

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

async function load(){
  const { data, error } = await db
    .from('shops')
    .select('id, name, tagline, slug, logo_url, created_at')
    .eq('is_published', true)
    .order('created_at', { ascending: false })
    .limit(200);

  if (error){
    console.error(error);
    contentEl.innerHTML = '<div class="empty-discover"><h3>Could not load shops</h3><p>Try again in a moment.</p></div>';
    return;
  }

  allShops = data || [];
  render();
}

function render(){
  const q = searchEl.value.trim().toLowerCase();

  const filtered = allShops.filter(function(s){
    if (!q) return true;
    return (s.name || '').toLowerCase().includes(q) ||
           (s.tagline || '').toLowerCase().includes(q);
  });

  if (!filtered.length){
    contentEl.innerHTML = `
      <div class="empty-discover">
        <h3>${q ? 'No shops match "' + esc(q) + '"' : 'No shops yet'}</h3>
        <p>${q ? 'Try a different search.' : 'Be the first to open a shop on KUMG.'}</p>
        <a href="store.html" style="display:inline-block;background:var(--green);color:#04140C;padding:12px 20px;border-radius:12px;font-weight:800;text-decoration:none;font-size:14px">Open your own shop</a>
      </div>
      <div class="cta-banner">
        <h3>Sell something?</h3>
        <p>Open your TouRryl Store in 5 minutes. Free to start.</p>
        <a href="store.html">Create your shop</a>
      </div>`;
    return;
  }

  contentEl.innerHTML = `
    <div class="shops-grid">
      ${filtered.map(function(s){
        const initial = (s.name || '?')[0].toUpperCase();
        const img = s.logo_url
          ? '<img src="' + esc(s.logo_url) + '" alt="" loading="lazy">'
          : '';
        return `
          <a class="shop-card" href="${STORE_BASE}${encodeURIComponent(s.slug)}" target="_blank" rel="noopener">
            <div class="banner">${initial}${img}</div>
            <div class="body">
              <div class="nm">${esc(s.name)}</div>
              <div class="tag">${esc(s.tagline || 'Shop now on WhatsApp')}</div>
            </div>
          </a>
        `;
      }).join('')}
    </div>
    <div class="cta-banner">
      <h3>Have something to sell?</h3>
      <p>Open your shop in 5 minutes. Take orders on WhatsApp. Free to start.</p>
      <a href="store.html">Create your shop</a>
    </div>
  `;
}

searchEl.addEventListener('input', render);

load();
</script>
</body>
</html>
