<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Profile — KUMG Forge</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
  var l = localStorage.getItem('kumg_lang') || 'en';
  document.documentElement.setAttribute('lang', l);
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="KUMG">
<link rel="stylesheet" href="css/style.css">
<style>
  .avatar-wrap{text-align:center;margin-bottom:22px}
  .avatar{
    width:104px;height:104px;border-radius:50%;
    background:linear-gradient(135deg,var(--deep),var(--green));
    display:grid;place-items:center;margin:0 auto 10px;
    font-size:38px;font-weight:900;color:#04140C;
    overflow:hidden;position:relative;cursor:pointer;
    border:2px solid var(--green);
  }
  .avatar img{width:100%;height:100%;object-fit:cover;display:block}
  .avatar .letter{display:block;line-height:1}
  .avatar .edit{
    position:absolute;bottom:-2px;right:-2px;
    background:var(--green);color:#04140C;
    width:32px;height:32px;border-radius:50%;
    display:grid;place-items:center;font-size:14px;
    border:3px solid var(--black);
  }
  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin:20px 0}
  .stat{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);padding:14px 8px;text-align:center;
  }
  .stat .num{font-size:22px;font-weight:800;color:var(--green)}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.6px}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Forge</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='settings.html'" style="font-size:13px;padding:8px 12px">Back</button>
  </div>
</header>

<main class="container" style="max-width:520px">
  <div class="avatar-wrap">
    <div class="avatar" id="avatar">
      <span class="letter" id="avatarLetter">?</span>
      <div class="edit">✎</div>
    </div>
    <input id="fileInput" type="file" accept="image/*" style="display:none">
    <p style="font-size:12px;color:var(--muted);margin:0">Tap to change photo</p>
  </div>

  <div class="card">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="yourname" maxlength="30" autocapitalize="off" autocorrect="off">

    <label for="bio">Bio</label>
    <textarea id="bio" rows="3" maxlength="160" placeholder="A short line about you."></textarea>

    <button class="btn btn-block" id="saveBtn" style="margin-top:16px">Save changes</button>
  </div>

  <div class="stats">
    <div class="stat"><div class="num" id="statProjects">0</div><div class="lbl">Projects</div></div>
    <div class="stat"><div class="num" id="statPublished">0</div><div class="lbl">Live</div></div>
    <div class="stat"><div class="num" id="statDays">0</div><div class="lbl">Days</div></div>
  </div>

  <div class="card">
    <div style="font-size:13px;color:var(--muted)">Email</div>
    <div style="font-weight:700;margin-bottom:12px;word-break:break-all" id="emailVal">—</div>
    <div style="font-size:13px;color:var(--muted)">Plan</div>
    <div style="font-weight:700" id="planVal">Free</div>
  </div>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script src="js/settings.js"></script>
<script>
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=> t.classList.remove('show'), 2200);
}

let userId = null;

async function init(){
  const { data } = await db.auth.getSession();
  if (!data.session){ location.href = 'auth.html'; return; }
  userId = data.session.user.id;
  document.getElementById('emailVal').textContent = data.session.user.email;

  const { data: profile } = await db
    .from('profiles')
    .select('username, plan, bio, avatar_url, created_at')
    .eq('id', userId)
    .maybeSingle();

  if (profile){
    document.getElementById('username').value = profile.username || '';
    document.getElementById('bio').value = profile.bio || '';
    document.getElementById('planVal').textContent = (profile.plan === 'pro' ? 'Pro' : 'Free');

    if (profile.avatar_url){
      const av = document.getElementById('avatar');
      av.innerHTML = `<img src="${profile.avatar_url}" alt="">
        <div class="edit">✎</div>`;
    } else {
      const letter = (profile.username || data.session.user.email || '?')[0].toUpperCase();
      document.getElementById('avatarLetter').textContent = letter;
    }

    if (profile.created_at){
      const days = Math.max(1, Math.floor((Date.now() - new Date(profile.created_at).getTime()) / 86400000));
      document.getElementById('statDays').textContent = days;
    }
  }

  // Stats
  const { count: projCount } = await db
    .from('projects').select('*', { count: 'exact', head: true })
    .eq('owner', userId);
  document.getElementById('statProjects').textContent = projCount || 0;

  const { count: pubCount } = await db
    .from('projects').select('*', { count: 'exact', head: true })
    .eq('owner', userId)
    .eq('is_published', true);
  document.getElementById('statPublished').textContent = pubCount || 0;
}

document.getElementById('avatar').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  if (file.size > 2 * 1024 * 1024){ toast('Max 2MB'); return; }
  if (!file.type.startsWith('image/')){ toast('Must be an image'); return; }

  toast('Uploading…');
  const ext = (file.name.split('.').pop() || 'png').toLowerCase();
  const path = userId + '/avatar.' + ext;

  const { error } = await db.storage
    .from('avatars')
    .upload(path, file, { upsert: true, cacheControl: '3600' });

  if (error){ toast(error.message || 'Upload failed'); return; }

  const { data: urlData } = db.storage.from('avatars').getPublicUrl(path);
  const publicUrl = urlData.publicUrl + '?t=' + Date.now();

  await db.from('profiles').update({ avatar_url: publicUrl }).eq('id', userId);

  const av = document.getElementById('avatar');
  av.innerHTML = `<img src="${publicUrl}" alt=""><div class="edit">✎</div>`;
  toast('Photo updated');
});

document.getElementById('saveBtn').addEventListener('click', async () => {
  const username = document.getElementById('username').value
    .trim().toLowerCase().replace(/[^a-z0-9_]/g,'');
  const bio = document.getElementById('bio').value.trim();

  if (username && username.length < 3){
    toast('Username must be 3+ characters');
    return;
  }

  try {
    const { error } = await db.from('profiles')
      .update({ username: username || null, bio })
      .eq('id', userId);
    if (error) throw error;
    toast('Saved');
  } catch(err){
    toast(err.message || 'Save failed');
  }
});

init();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
</body>
</html>
