<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0A0A">
<title>Admin — KUMG Forge</title>
<script>
(function(){
  var t = localStorage.getItem('kumg_theme');
  if (t === 'light') document.documentElement.setAttribute('data-theme','light');
})();
</script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/style.css">
<style>
  .quick-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .quick-card{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    text-decoration: none;
    color: inherit;
    transition: border-color .15s ease;
  }
  .quick-card:hover{ border-color: var(--green); }
  .quick-card:active{ background: var(--deep); }

  .quick-icon{
    width: 40px;
    height: 40px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--deep), var(--green));
    display: grid;
    place-items: center;
  }
  .quick-icon svg{
    width: 20px;
    height: 20px;
    stroke: #04140C;
    fill: none;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .quick-card .qt{
    font-weight: 800;
    font-size: 14.5px;
    margin: 0;
  }
  .quick-card .qs{
    font-size: 11.5px;
    color: var(--muted);
    margin: 2px 0 0;
    line-height: 1.4;
  }

  .stat-grid{
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 24px;
  }
  .stat{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 16px;
  }
  .stat .num{
    font-size: 26px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: -0.5px;
  }
  .stat .lbl{
    font-size: 11.5px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .7px;
    margin-top: 2px;
    font-weight: 700;
  }

  .section-title{
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--muted);
    font-weight: 800;
    margin: 24px 0 10px;
  }

  .u-row{
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .u-row .top{
    display: flex;
    justify-content: space-between;
    gap: 8px;
    align-items: center;
  }
  .u-row .email{
    font-weight: 700;
    word-break: break-all;
    font-size: 13.5px;
  }
  .u-row .meta{
    color: var(--muted);
    font-size: 11.5px;
    margin-top: 4px;
  }
  .badge{
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: .5px;
    padding: 3px 8px;
    border-radius: 999px;
    text-transform: uppercase;
  }
  .badge.plan-free{ background: var(--deep); color: var(--mint); }
  .badge.plan-pro{ background: var(--green); color: #04140C; }
  .badge.admin{ background: #C43D3D; color: #fff; }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;color:inherit;text-decoration:none">
      <div class="logo">K</div>
      <div>KUMG <span class="accent">Admin</span></div>
    </a>
  </div>
  <div class="actions">
    <button class="btn-ghost" onclick="location.href='index.html'" style="font-size:13px;padding:8px 12px">Home</button>
  </div>
</header>

<main class="container" style="max-width:640px">
  <h1 class="page-title">Founder dashboard</h1>
  <p class="page-sub">Live stats and controls.</p>

  <div class="quick-grid">
    <a href="sponsors.html" class="quick-card">
      <div class="quick-icon">
        <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div>
        <p class="qt">Sponsors</p>
        <p class="qs">Manage KUMG Tap cards and balances</p>
      </div>
    </a>
    <a href="discover.html" class="quick-card">
      <div class="quick-icon">
        <svg viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v11a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9z"/><path d="M9 21v-6h6v6"/></svg>
      </div>
      <div>
        <p class="qt">Discover</p>
        <p class="qs">Public shops directory</p>
      </div>
    </a>
  </div>

  <div class="stat-grid">
    <div class="stat"><div class="num" id="sUsers">—</div><div class="lbl">Users</div></div>
    <div class="stat"><div class="num" id="sProjects">—</div><div class="lbl">Projects</div></div>
    <div class="stat"><div class="num" id="sPublished">—</div><div class="lbl">Live sites</div></div>
    <div class="stat"><div class="num" id="sPro">—</div><div class="lbl">Pro users</div></div>
    <div class="stat"><div class="num" id="sShops">—</div><div class="lbl">Shops</div></div>
    <div class="stat"><div class="num" id="sSponsors">—</div><div class="lbl">Sponsors</div></div>
  </div>

  <div class="section-title">Latest users</div>
  <div id="users"></div>

  <footer style="text-align:center;font-size:12px;color:var(--muted);padding:24px 0">
    <a href="terms.html" style="color:var(--muted)">Terms</a> ·
    <a href="privacy.html" style="color:var(--muted)">Privacy</a>
  </footer>
</main>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
<script>
function timeAgo(iso){
  const s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s/60) + 'm ago';
  if (s < 86400) return Math.floor(s/3600) + 'h ago';
  return Math.floor(s/86400) + 'd ago';
}
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

(async () => {
  const sess = await db.auth.getSession();
  if (!sess.data.session){ location.href = 'auth.html'; return; }

  const me = await db.from('profiles').select('is_admin').eq('id', sess.data.session.user.id).maybeSingle();
  if (!me.data || !me.data.is_admin){
    document.querySelector('main').innerHTML =
      '<div class="empty"><h3>Not allowed</h3><p>You are not an admin.</p></div>';
    return;
  }

  const [uC, pC, pubC, proC, shopC, spC] = await Promise.all([
    db.from('profiles').select('*', { count:'exact', head:true }),
    db.from('projects').select('*', { count:'exact', head:true }),
    db.from('projects').select('*', { count:'exact', head:true }).eq('is_published', true),
    db.from('profiles').select('*', { count:'exact', head:true }).eq('plan', 'pro'),
    db.from('shops').select('*', { count:'exact', head:true }),
    db.from('sponsors').select('*', { count:'exact', head:true })
  ]);

  document.getElementById('sUsers').textContent = uC.count || 0;
  document.getElementById('sProjects').textContent = pC.count || 0;
  document.getElementById('sPublished').textContent = pubC.count || 0;
  document.getElementById('sPro').textContent = proC.count || 0;
  document.getElementById('sShops').textContent = shopC.count || 0;
  document.getElementById('sSponsors').textContent = spC.count || 0;

  const { data: users } = await db
    .from('profiles')
    .select('id, email, username, plan, is_admin, created_at')
    .order('created_at', { ascending: false })
    .limit(30);

  const wrap = document.getElementById('users');
  if (!users || !users.length){
    wrap.innerHTML = '<p style="color:var(--muted);font-size:13.5px">No users yet.</p>';
    return;
  }

  wrap.innerHTML = users.map(function(u){
    const planClass = u.plan === 'pro' ? 'plan-pro' : 'plan-free';
    return `
      <div class="u-row">
        <div class="top">
          <div class="email">${esc(u.email || u.username || 'unknown')}</div>
          <div style="display:flex;gap:6px">
            ${u.is_admin ? '<span class="badge admin">Admin</span>' : ''}
            <span class="badge ${planClass}">${esc(u.plan || 'free')}</span>
          </div>
        </div>
        <div class="meta">@${esc(u.username || '—')} · joined ${timeAgo(u.created_at)}</div>
      </div>
    `;
  }).join('');
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
